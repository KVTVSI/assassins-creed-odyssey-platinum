ен квест Харона «Лучше смерть, чем бесчестье», после которого открывается «Проклятая болезнь».",spoiler:false,labels:["Не подтверждено"],src:["st324"],kind:"bug"},{text:"№92: если убить финального босса эпизода 3 без трёх оружий, вас вернёт в основную игру. Вернуться можно через карту мира, раздел других миров.",spoiler:false,labels:["Не подтверждено"],src:["st404"],kind:"other"},{text:"№94: если после помощи трём Архонтам финальный квест не появился, закройте все задания с красными ромбами на карте.",spoiler:false,labels:["Не подтверждено"],src:["st331"],kind:"other"}],trophies:[80,81,82,83,84,85,86,87,88,89,90,91,92,93,94]}],trophies:[{num:1,en:"Epic Cycle",ru:"Эпос",ruOfficial:true,desc:"Получить все призы.",descOfficial:true,type:"platinum",hidden:false,dlc:false,group:"Base Game",rarity:"4.2%",rarityLabel:"Ultra Rare",stage:"s9",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Платина выдаётся за все остальные трофеи основной игры; хватает одного прохождения, уровень сложности на трофеи не влияет — всё можно делать на лёгком.",spoiler:false,labels:["Подтверждено"],src:["pp1","st401"]},{text:"Ориентир по времени — около 60–70 часов, если заранее знать, какие задания нужны для трофеев, и не делать лишнего.",spoiler:false,labels:["Подтверждено"],src:["pp1","st401"]},{text:"Сначала спокойно пройдите основной сюжет, а цепочки побочных героев закрывайте после: многие их квесты открываются только по ходу истории.",spoiler:false,labels:["Не подтверждено"],src:["st401"]},{text:"По гайду PowerPyx, трофеи дополнений для платины не нужны.",spoiler:false,labels:["Не подтверждено"],src:["pp1"]}]},{num:2,en:"This is Sparta!",ru:"Это Спарта!",ruOfficial:true,desc:"Завершить Фермопильское сражение.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"93.5%",rarityLabel:"Common",stage:"s1",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Сюжетный трофей за самую первую битву пролога, где вы играете за Леонида у Фермопил (это не первый бой за Алексиоса/Кассандру); при обычной игре пропустить нельзя.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st101"]},{text:"Пол героя, выбор реплик и режим исследования на трофеи не влияют и ничего не блокируют.",spoiler:false,labels:["Не подтверждено"],src:["pp1"]},{text:"Если пролог не засчитался (например, игра начата через «Новую игру+»), начните обычную новую игру — сцена с Леонидом гарантированно будет.",spoiler:false,labels:["Не подтверждено"],src:["st101"]}]},{num:3,en:"An Odyssey in the Making",ru:"Начало Одиссеи",ruOfficial:true,desc:"Завершить эпизод 1.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"66.8%",rarityLabel:"Common",stage:"s1",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Автоматический сюжетный трофей за эпизод 1 на Кефалинии: выдаётся, когда вы отплываете с острова на корабле.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]}]},{num:4,en:"Past Mistakes",ru:"Ошибки прошлого",ruOfficial:true,desc:"Завершить эпизод 2.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"60.4%",rarityLabel:"Common",stage:"s2",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Автоматический сюжетный трофей за эпизод 2 в Мегариде, пропустить нельзя.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]},{text:"В конце эпизода, после битвы за завоевание, будет сюжетная сцена с выбором; на трофей этот выбор не влияет, трофей падает после сцены.",spoiler:false,labels:["Не подтверждено"],src:["psn101"]}]},{num:5,en:"Evil Unearthed",ru:"Зло раскрыто",ruOfficial:true,desc:"Завершить эпизод 3.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"56.1%",rarityLabel:"Common",stage:"s2",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Автоматический сюжетный трофей за эпизод 3 (в основном Фокида), пропустить нельзя.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]},{text:"В эпизоде нужно выследить нескольких персонажей и впервые узнать о Культе Космоса; трофей выдаётся по его завершении.",spoiler:false,labels:["Не подтверждено"],src:["psn101"]}]},{num:6,en:"The Bright Minds",ru:"Блестящие умы",ruOfficial:true,desc:"Завершить эпизод 4.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"47.0%",rarityLabel:"Rare",stage:"s2",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Автоматический сюжетный трофей за эпизод 4, пропустить нельзя.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]},{text:"Трофей выпадает не сразу после пунктов эпизода, а после разговора с Периклом по окончании симпозиума в Афинах, хотя следующую главу игра позволяет начать раньше.",spoiler:false,labels:["Не подтверждено"],src:["psn201"]}]},{num:7,en:"From the Ashes",ru:"Из пепла",ruOfficial:true,desc:"Завершить эпизод 5.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"40.6%",rarityLabel:"Rare",stage:"s3",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Автоматический сюжетный трофей за эпизод 5, пропустить нельзя.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]},{text:"Эпизод — плавание по островам в поисках членов Культа; завершается квестом, где на алтаре нужно спасти ребёнка, после него и падает трофей.",spoiler:false,labels:["Не подтверждено"],src:["psn101"]}]},{num:8,en:"Democracy Falls",ru:"Крушение демократии",ruOfficial:true,desc:"Завершить эпизод 6.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"40.3%",rarityLabel:"Rare",stage:"s3",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Автоматический сюжетный трофей за эпизод 6 (Афины и Аттика), пропустить нельзя.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]},{text:"В конце эпизода Фойбу убивают Деймос и культисты, после чего выдаётся трофей.",spoiler:true,labels:["Не подтверждено"],src:["psn101"]}]},{num:9,en:"Legend in the Making",ru:"Так создается легенда",ruOfficial:true,desc:"Завершить эпизод 7.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"32.5%",rarityLabel:"Rare",stage:"s4",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Автоматический сюжетный трофей за эпизод 7, пропустить нельзя.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]},{text:"Это самый долгий эпизод: во время него удобно закрыть цепочки Гиппократа и Пифагора, Сфинкса, Олимпийские игры и почти всех культистов.",spoiler:false,labels:["Не подтверждено"],src:["st102"]},{text:"Здесь вы наконец находите мать; трофей падает после боя на выжженной земле и новой встречи с Деймосом.",spoiler:true,labels:["Не подтверждено"],src:["psn101"]}]},{num:10,en:"Taking Back Athens",ru:"Отбить Афины",ruOfficial:true,desc:"Завершить эпизод 8.",descOfficial:true,type:"silver",hidden:true,dlc:false,group:"Base Game",rarity:"31.7%",rarityLabel:"Rare",stage:"s5",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Автоматический сюжетный трофей за эпизод 8: последний квест — битва за завоевание на севере, трофей после победы.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]},{text:"С этой главы уровень персонажа почти не мешает, сюжет можно проходить напролом.",spoiler:false,labels:["Не подтверждено"],src:["st103"]}]},{num:11,en:"Odyssey's End",ru:"Конец Одиссеи",ruOfficial:true,desc:"Завершить эпизод 9 и эпилог.",descOfficial:true,type:"gold",hidden:true,dlc:false,group:"Base Game",rarity:"31.3%",rarityLabel:"Rare",stage:"s5",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Автоматический сюжетный трофей за эпизод 9 и эпилог, пропустить нельзя.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]},{text:"Из-за больших разрывов по уровню сюжет придётся перемежать побочками (особенно в эпизоде 7, разница около 10 уровней); на сюжет уходит 40–50 часов.",spoiler:false,labels:["Не подтверждено"],src:["pp1","pp7","pp19"]},{text:"Финальный выбор — убить или пощадить Деймоса — определяет одну из двух концовок, но трофей дают при любой.",spoiler:true,labels:["Не подтверждено"],src:["psn101"]}]},{num:12,en:"Child of Poseidon",ru:"Дитя Посейдона",ruOfficial:true,desc:"Выполнить все подводные задания.",descOfficial:true,type:"silver",hidden:false,dlc:false,group:"Base Game",rarity:"5.5%",rarityLabel:"Very Rare",stage:"s6",missable:false,online:false,buggy:false,grind:true,tips:[{text:"Нужно пройти все 42 подводные локации (значок затонувшего корабля); они доступны сразу после получения корабля в эпизоде 2, порядок любой. Локация засчитана, только когда на карте появилась отметка о завершении; подсвечивайте объекты орлом. Если трофей не выпал, почти всегда пропущена одна точка: сверяйтесь с пронумерованной картой всех 42 локаций из гайда PowerPyx.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp3","psn101","st104"]},{text:"Запертый сундук в Затопленном минойском дворце у юга Кеоса открывается ключом из побочного квеста «Мы не воры» (We're Not Thieves) на Кеосе, поэтому сразу после эпизода 2 всё зачистить не выйдет.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st104","st405"]},{text:"Трезубец/копьё Посейдона даёт бесконечное дыхание под водой: лежит на островке с храмом Посейдона севернее Самоса, львов-охранников можно обойти скрытно (ночью). Оружие 44-го уровня, но его гравировку можно перенести на своё.",spoiler:false,labels:["Подтверждено"],src:["psn201","st104"]},{text:"По комментарию на PowerPyx, баг с зачётом после правки минойского дворца убрали патчами 1.1.0 и 1.1.1: после установки трофей выпал сразу.",spoiler:false,labels:["Не подтверждено"],src:["pp1"]},{text:"Stratege.ru исправления не подтверждает: после патча, изменившего минойский дворец, трофей мог не засчитываться, и помогал только откат на сохранение, где дворец ещё не тронут, или новая игра.",spoiler:false,labels:["Не подтверждено","Устарело?"],src:["st405"]}]},{num:13,en:"Make It Your Own",ru:"Право собственности",ruOfficial:true,desc:"Сделать гравировку на предмете.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"57.7%",rarityLabel:"Common",stage:"s2",missable:false,online:false,buggy:false,grind:false,tips:[{text:"У любого кузнеца выберите «Гравировка» и нанесите любой эффект на любой предмет — хватит одного раза.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st105"]},{text:"Новые гравировки открываются с ростом уровня и с получением легендарных предметов; материалы для них недороги и продаются у кузнеца.",spoiler:false,labels:["Подтверждено"],src:["pp1","st105"]}]},{num:14,en:"You Work for Me Now",ru:"Ты работаешь на меня",ruOfficial:true,desc:"Взять в команду легендарного персонажа и назначить его.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"52.4%",rarityLabel:"Common",stage:"s3",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Оглушите (не убивая) легендарного врага с жёлтой редкостью, завербуйте его и назначьте лейтенантом на корабль — хватит одного.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st106"]},{text:"Последний удар должен быть без оружия или «Спартанским пинком»; добейте остальных врагов, выйдите из боя и нажмите L3 над оглушённым, затем наймите его в меню корабля.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp11","st106"]},{text:"Редкость цели видно, если отметить её орлом; легендарными часто бывают полемархи и капитаны фортов (автор PowerPyx находил их в форте Тиринф в Арголиде) и высокоранговые наёмники.",spoiler:false,labels:["Подтверждено"],src:["pp1","st106"]},{text:"Через Ubisoft Club бесплатно доступна легендарная Иви Фрай (появляется не сразу), а при наличии «Истоков» — Байек и Айя; их можно сразу назначить.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp11","st106"]}]},{num:15,en:"Shiny!",ru:"Блестяще!",ruOfficial:true,desc:"Получить и использовать свой первый легендарный предмет.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"73.5%",rarityLabel:"Common",stage:"s2",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Почти сюжетный трофей: первый легендарный предмет выпадает по ходу игры, достаточно его экипировать.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st107"]},{text:"Первый легендарный предмет, Меч Николаоса, выдают в конце эпизода 2.",spoiler:false,labels:["Не подтверждено"],src:["pp1"]}]},{num:16,en:"I am Legend",ru:"Я – легенда",ruOfficial:true,desc:"Вооружиться легендарным оружием ближнего боя и надеть 5 элементов легендарных доспехов.",descOfficial:true,type:"silver",hidden:false,dlc:false,group:"Base Game",rarity:"58.7%",rarityLabel:"Common",stage:"s8",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Одновременно наденьте легендарное оружие ближнего боя и пять легендарных элементов брони (голова, руки, торс, пояс, ноги); из одного комплекта они быть не обязаны.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st108"]},{text:"Основные источники — культисты (каждый роняет легендарную вещь), награды за квесты, наёмники; легендарки нельзя продать или разобрать, так что пропустить трофей нельзя.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]},{text:"Полный легендарный комплект плюс любое легендарное оружие закрывают сразу «Shiny!», «Fashion's Creed» и этот трофей.",spoiler:false,labels:["Не подтверждено"],src:["st108"]},{text:"Быстрый вариант после обновлений 2020 года: Датский топор, комплекты «Странник севера» и Аудиторе, Миланский меч — всё легендарное, надевайте сразу.",spoiler:false,labels:["Не подтверждено"],src:["st108"]}]},{num:17,en:"Are You Not Entertained?",ru:"Как вам развлечение?",ruOfficial:true,desc:"Стать чемпионом Арены.",descOfficial:true,type:"silver",hidden:false,dlc:false,group:"Base Game",rarity:"26.6%",rarityLabel:"Rare",stage:"s7",missable:true,online:false,buggy:false,grind:false,tips:[{text:"Арена — в регионе Пефка (юго-восток карты): нужно победить всех пятерых чемпионов, а не только последнего; перед каждым идут волны врагов, следите за ловушками.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp9","psn101","st109"]},{text:"Уровни чемпионов: 22, 29, 36, 43 и 50; с хорошим снаряжением игроки побеждали последнего на 45–48 уровне.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp9","st109"]},{text:"Для арены лучше подходит сборка воина; если последние бои не идут, временно снизьте сложность.",spoiler:false,labels:["Подтверждено"],src:["pp7","st109"]},{text:"Квест арены (They Just Want Cruelty) начинается с приглашения, которое падает с наёмника: обязательно обыщите тело первого, Талоса Каменного Кулака. Игрок, не нашедший его тело, приглашения больше не получил и начал заново.",spoiler:false,labels:["Не подтверждено"],src:["psn201"]}]},{num:18,en:"Demigod",ru:"Полубог",ruOfficial:true,desc:"Достичь уровня 50.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"29.6%",rarityLabel:"Rare",stage:"s9",missable:false,online:false,buggy:false,grind:true,tips:[{text:"Сюжет обычно даёт 37–40 уровень, побочки — около 45-го; одного прохождения сюжета не хватит, это один из самых долгих трофеев.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]},{text:"Лучшее место для последних уровней — арена в Пефке: после пяти чемпионов появляются бойцы 50-го уровня, около 70 000 опыта за первую победу (бой ~2 минуты) и вдвое меньше за повторные.",spoiler:false,labels:["Подтверждено"],src:["pp1","st110"]},{text:"Берите все контракты на досках объявлений (жёлтая иконка опыта выгоднее синей и фиолетовой) и участвуйте в битвах за завоевание — PowerPyx советует нападающую сторону на «сложно».",spoiler:false,labels:["Подтверждено"],src:["pp7","psn101","st110"]},{text:"Ускорители опыта: +25% на 2 часа в Ubisoft Club и постоянный +50% за кредиты Helix; можно накопить контракты и квесты и сдать их под ускорителем.",spoiler:false,labels:["Не подтверждено"],src:["pp7","pp19"]},{text:"Если закрывать все трофейные задания, к их концу уровень сам приблизится к 50-му — отдельно качаться обычно не нужно.",spoiler:false,labels:["Не подтверждено"],src:["st110"]}]},{num:19,en:"Godly Power",ru:"Божественная мощь",ruOfficial:true,desc:"Получить способность 3-го уровня.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"34.6%",rarityLabel:"Rare",stage:"s8",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Активные способности 3-го уровня открываются только после улучшения Копья Леонида до 5-го уровня; пассивные навыки не считаются.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st111"]},{text:"Копьё улучшают осколками артефактов, которые падают с культистов, в Древней кузнице на Андросе (открывается по сюжету).",spoiler:false,labels:["Подтверждено"],src:["pp1","st111"]}]},{num:20,en:"Legacy Restored",ru:"Восстановление наследия",ruOfficial:true,desc:"Улучшить свое копье до 6-го уровня.",descOfficial:true,type:"silver",hidden:true,dlc:false,group:"Base Game",rarity:"22.7%",rarityLabel:"Rare",stage:"s8",missable:false,online:false,buggy:false,grind:true,tips:[{text:"Копьё достигает 6-го уровня только после убийства всех культистов, поэтому трофей идёт в паре с «The Cult Unmasked».",spoiler:false,labels:["Подтверждено"],src:["st112","pp1","psn101"]},{text:"По комментарию на PSNProfiles, с патча 1.14 убивать всех культистов не нужно: хватает обычных, и копьё можно улучшить ещё до боя с главой Культа.",spoiler:false,labels:["Не подтверждено"],src:["psn201"]},{text:"Улучшение — в Древней кузнице на Андросе осколками артефактов, которые падают только с культистов; доступно примерно с эпизода 4.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]},{text:"В первых версиях культисты Зоисма и Каллий застревали под храмом Дельфийского оракула и не умирали; исправлено патчем 1.03.",spoiler:false,labels:["Не подтверждено","Устарело?"],src:["pp1"]}]},{num:21,en:"Top of the Food Chain",ru:"Вершина пищевой цепи",ruOfficial:true,desc:"Стать первым наемником.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"24.7%",rarityLabel:"Rare",stage:"s7",missable:false,online:false,buggy:false,grind:true,tips:[{text:"Каждый убитый наёмник рангом выше поднимает вас лишь на одну позицию; порядок не важен, но перепрыгнуть сразу через несколько нельзя, а убивать тех, кто ниже, бесполезно.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st113"]},{text:"В меню «Наёмники» выберите цель и включите отслеживание — на карте появится метка; либо поднимите розыск, и наёмники придут сами.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st113"]},{text:"Удобнее после сюжета и открытия точек синхронизации; нападайте скрытно. Против сильных помогает лук с крыши высокого храма, куда они не забираются.",spoiler:false,labels:["Не подтверждено"],src:["st113"]},{text:"Часть наёмников сражается на арене Пефки, так что трофей пересекается с «Blood Sport».",spoiler:false,labels:["Не подтверждено"],src:["pp1","pp9"]},{text:"Пропустить трофей нельзя: наёмники выше вас найдутся всегда.",spoiler:false,labels:["Не подтверждено"],src:["pp1"]}]},{num:22,en:"The Cult Unmasked",ru:"Маски Культа сорваны",ruOfficial:true,desc:"Победить всех членов Культа Космоса.",descOfficial:true,type:"silver",hidden:true,dlc:false,group:"Base Game",rarity:"22.9%",rarityLabel:"Rare",stage:"s8",missable:false,online:false,buggy:false,grind:true,tips:[{text:"Нужно убить всех 42 культистов; в меню Культа выберите силуэт, чтобы увидеть подсказку, где искать цель. Мудрец ветви открывается после пятерых её участников, глава Культа — после остальных 41.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp4","psn101"]},{text:"Многие культисты открываются только по сюжету, поэтому лучше сначала пройти игру, а затем добивать оставшихся по меню.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp4","st114"]},{text:"Культисты часто встречаются в морских боях, побочках с оранжевым знаком и битвах за завоевание; некоторых можно встретить, просто бродя по миру, раньше подсказки.",spoiler:false,labels:["Подтверждено"],src:["st114","psn101","psn201"]},{text:"Культист Паллас появляется только в битве за завоевание Ахеи на стороне Афин — сражаясь за Спарту, его можно упустить.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp4","psn101"]},{text:"Деймоса можно не убивать ради другой концовки: он останется в списке, но трофей всё равно дадут.",spoiler:true,labels:["Не подтверждено"],src:["pp1"]}]},{num:23,en:"Stink Eye",ru:"Вонючий глаз",ruOfficial:true,desc:"Извлечь глаз Циклопа из козы на Кефалинии.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"12.9%",rarityLabel:"Very Rare",stage:"s1",missable:false,online:false,buggy:true,grind:true,tips:[{text:"После боя с Циклопом в эпизоде 1 (дожидаться конца эпизода не обязательно) убивайте коз на Кефалинии и обыскивайте трупы: глаз выпадает случайно.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st115"]},{text:"Обычно хватает 5–20 коз, удобно стрелять из лука. Много коз на холме на юге острова (Пронойский полуостров) и у статуи «Зевс-громовержец».",spoiler:false,labels:["Подтверждено"],src:["pp1","st115"]},{text:"Бывает, что нужной козы нет даже после сотен убитых; помогает полностью закрыть игру и заново загрузить сохранение.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn201","psn212"]}]},{num:24,en:"Hermes's Homie",ru:"Следом за Гермесом",ruOfficial:true,desc:"Открыть все области Греции.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"5.4%",rarityLabel:"Very Rare",stage:"s6",missable:false,online:false,buggy:true,grind:true,tips:[{text:"Нужно открыть все области Греции, включая море; знаки вопроса и таинственные места не нужны, как и закрытые горы севернее Фокиды и кусок за картой на северо-западе.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st116"]},{text:"На мелкие островки обязательно высаживайтесь, даже если туман над ними уже рассеян; признак засчитанного — немного опыта.",spoiler:false,labels:["Подтверждено"],src:["st116","pp1","psn101"]},{text:"По комментарию на PSNProfiles, вставать на крошечные острова и скалы не нужно, если они входят в границы крупного региона.",spoiler:false,labels:["Не подтверждено"],src:["psn201"]},{text:"Чаще всего пропускают: остров Крадия под Самосом, Лестрис (высадитесь и пройдите пешком), кальдера Арга у Пефки, Мраморный залив на Наксосе, Тёплые источники на Гидрее, Горы Парнес, Песчаный залив Фалерон, Долину двух царей у Спарты и узкие горные области. Посещённое удобно отмечать фото-режимом.",spoiler:false,labels:["Подтверждено"],src:["st116","st406","psn201","pp1"]},{text:"Трофей может выпасть с большой задержкой; если уверены, что открыли всё, PowerPyx советует переустановить игру и обойти карту снова, в крайнем случае начать с нуля.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","psn210"]}]},{num:25,en:"In Perseus's Image",ru:"В стиле Персея",ruOfficial:true,desc:"Победить Медузу.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"25.9%",rarityLabel:"Rare",stage:"s7",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Пройдите цепочку квестов на Лесбосе («Во спасение любви» и далее до «Великого ужаса»; в оригинале Romancing the Stone Garden … Writhing Dead): только после неё откроется Окаменевший храм с Медузой.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp15","psn101","st117"]},{text:"Медуза около 50-го уровня, идти лучше с 46-го; на высоком уровне героя её уровень подстраивается, так что босса удобно оставить на конец.",spoiler:false,labels:["Подтверждено"],src:["pp1","st117"]},{text:"Тактика: прячьтесь за колоннами от замедляющего луча, бейте из лука (огненные или ядовитые стрелы) и убивайте призванных врагов — тогда щит спадает и Медуза уязвима.",spoiler:false,labels:["Подтверждено"],src:["psn101","st117"]},{text:"Бой может зависнуть, когда у Медузы около трети здоровья и появляются новые враги; помогает перезапуск.",spoiler:false,labels:["Не подтверждено"],src:["pp1"]}]},{num:26,en:"A-maze-ing Victory!",ru:"НеоБЫКновенная победа",ruOfficial:true,desc:"Победить Минотавра.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"30.4%",rarityLabel:"Rare",stage:"s7",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Цепочка на Месаре: «Мифы и минотавры» (Myths and Minotaurs), «О минотаврах и людях» (Of Minotaurs and Men) с побочками, «Он ждёт» (He Waits); до её конца вход в Лабиринт закрыт.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp14","psn101","st118"]},{text:"В Лабиринте идите по золотой нити до трупа с кольцом, затем вернитесь на пару шагов, сверните налево и прыгайте по платформам к боссу.",spoiler:false,labels:["Не подтверждено"],src:["pp14"]},{text:"Бой в две фазы: держите дистанцию и не жадничайте из-за атак по площади; после половины здоровья Минотавр ускоряется и делает рывки, уворачивайтесь от удара рогами.",spoiler:false,labels:["Подтверждено"],src:["psn101","st118"]},{text:"Перед боем осмотрите Лабиринт (сундуки с обсидианом и камнями): после победы вернуться туда нельзя. На трофей это не влияет.",spoiler:false,labels:["Не подтверждено"],src:["st118"]}]},{num:27,en:"Eye on the Prize",ru:"Глаз в награду",ruOfficial:true,desc:"Победить Циклопа.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"29.5%",rarityLabel:"Rare",stage:"s7",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Это не Циклоп из эпизода 1. Цепочка на Китире: «Бог среди людей» (A God Among Men), «Брошенный насмерть» (Left to Dye), «Лестница к Олимпу» (Stairway to Olympos); затем бой на Забытом острове к югу от Фокиды.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp13","psn101","st119"]},{text:"Удары медленные, но мощные: берегитесь топота с ударной волной, рывка, захвата и падающих валунов; после половины здоровья он берёт колонну. Удобно бить из лука.",spoiler:false,labels:["Подтверждено"],src:["psn101","st119"]},{text:"Уровень Циклопа подстраивается под ваш (у игрока 54-го уровня был 50-й).",spoiler:false,labels:["Не подтверждено"],src:["st119"]}]},{num:28,en:"Riddle Me This",ru:"Мастер загадок",ruOfficial:true,desc:"Решить загадки Сфинкса.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"32.5%",rarityLabel:"Rare",stage:"s7",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Сначала пройдите «Семейное наследие» (A Family's Legacy) на Фере в эпизоде 7 и попадите в Атлантиду к Пифагору — без этого Сфинкс недоступен; дальше квесты в Беотии (Lore of the Sphinx, Awaken the Myth). Сам Сфинкс — не бой: он задаёт три случайные загадки из 12, затем на стене нужно нажать три плиты с символами ваших ответов. Записывайте ответы — ошибка убивает, и вопросы меняются.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp16","psn101","st120"]},{text:"Ответы, общие для PowerPyx и Stratege.ru: колибри (легче пёрышка), дерево (весной в наряде, зимой голое), солнце (молча идёт с холма на холм), память (возвращает мёртвых), луна (всегда старая, иногда новая), гора (велика, но не растёт), звёзды (приходят ночью без зова), паук (плетёт логово), время (всё пожирает), река (бежит, но не ходит).",spoiler:false,labels:["Подтверждено"],src:["pp16","st120"]},{text:"Ещё два ответа из пула, только по PowerPyx: смерть (от неё не спрятаться) и рыба (жива без дыхания, всегда пьёт).",spoiler:false,labels:["Не подтверждено"],src:["pp16"]},{text:"По комментариям Stratege.ru, в русской версии загадки могут звучать иначе (игрок встретил, например, ответ «комар»), поэтому ориентируйтесь на двенадцать символов на плитах: луна, солнце, звёзды, дерево, гора, вода, голова, время, череп, колибри, рыба, паук.",spoiler:false,labels:["Не подтверждено"],src:["st120"]},{text:"Один игрок считал, что загадки доступны только ночью и после финала Сфинкс пропадает; другой это опроверг. На всякий случай приходите ночью и до конца сюжета.",spoiler:false,labels:["Не подтверждено"],src:["st408"]}]},{num:29,en:"Lord of the Seas",ru:"Владыка морей",ruOfficial:true,desc:"Улучшите \"Адрестию\" до легендарного уровня.",descOfficial:true,type:"silver",hidden:false,dlc:false,group:"Base Game",rarity:"13.5%",rarityLabel:"Very Rare",stage:"s9",missable:false,online:false,buggy:false,grind:true,tips:[{text:"Улучшите все части «Адрестии» до легендарного (жёлтого) уровня: залпы стрел, залпы копий, жаровни, стрелы и копья — по 4, таран и корпус — по 6, выносливость гребцов — 4, броня экипажа — 3.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st121"]},{text:"Ступени выше легендарной, добавленные с повышением лимита уровня, для трофея не нужны: он выпадает, когда каждая часть дошла до легендарного уровня.",spoiler:false,labels:["Подтверждено"],src:["st121","psn201"]},{text:"По комментарию на PowerPyx, после повышения лимита уровня до 70 трофею потребовались дополнительные улучшения корабля.",spoiler:false,labels:["Не подтверждено","Устарело?"],src:["pp1"]},{text:"Не тратьте материалы до 4-го ранга наёмника: он даёт скидку около 50% на улучшения корабля.",spoiler:false,labels:["Подтверждено"],src:["st121","psn201"]},{text:"Самый дефицитный ресурс — древние таблички: они лежат в руинах (подсвечивайте орлом) и понемногу продаются у кузнецов, где можно купить и дерево; железо и дерево дают потопленные корабли и разбор снаряжения.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp5","pp6","psn101","psn201","st121"]}]},{num:30,en:"The Argonauts",ru:"Аргонавты",ruOfficial:true,desc:"Собрать на \"Адрестии\" легендарную команду.",descOfficial:true,type:"silver",hidden:false,dlc:false,group:"Base Game",rarity:"28.3%",rarityLabel:"Rare",stage:"s9",missable:false,online:false,buggy:false,grind:true,tips:[{text:"Нужно четыре легендарных (жёлтых) лейтенанта на корабле, а для четырёх мест корпус должен быть улучшен до 4-го уровня.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp11","psn101"]},{text:"Ищите их среди командиров фортов, капитанов, полемархов и наёмников; редкость проверяйте орлом Икаром. Оглушите без убийства (без оружия или пинком, но не в стену) и завербуйте.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp11","psn101","psn201","st122"]},{text:"После сюжета выжившие члены семьи героя становятся легендарными лейтенантами; при лучшем исходе семейной линии набирается почти вся команда.",spoiler:true,labels:["Подтверждено"],src:["pp1","st122"]},{text:"Ещё варианты: легендарная Роксана за квест на Гидрее (не убивайте её в конце), Иви Фрай и другие из Ubisoft Club, покупка за орихалк.",spoiler:false,labels:["Подтверждено"],src:["st122","pp1","pp11"]},{text:"Чтобы оглушить ослабленного легендарного наёмника, скройтесь из виду, подкрадитесь со спины и оглушите.",spoiler:false,labels:["Не подтверждено"],src:["st122"]}]},{num:31,en:"Master of the Hunt",ru:"Мастер охоты",ruOfficial:true,desc:"Завершить сюжетную линию Дочерей Артемиды.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"21.1%",rarityLabel:"Rare",stage:"s6",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Цепочка «Дочери Артемиды» начинается у Дафны в Фокиде (Священные земли Аполлона): нужно убить восемь легендарных зверей по всей Греции, затем вернуться к Дафне на Хиос за финальным квестом.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","psn201","st123"]},{text:"Звери: Калидонский вепрь (Фокида), медведица Каллисто (Аркадия), Эриманфский вепрь (Элида), Керинейская лань (Эвбея), Критский бык (Месара), гиена Крокотта (Китира), Ликаонский волк (Лакония), Немейский лев (Арголида).",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]},{text:"Кабана и льва легко расстрелять из лука с уступа, лань удобно бить верхом (садитесь на коня вне её зоны); можно привести к зверю наёмников, подняв награду за голову. Калидонский вепрь зовёт кабанов и лечится — убивайте быстро.",spoiler:false,labels:["Подтверждено"],src:["st123","psn101"]},{text:"За каждого зверя дают часть легендарного комплекта Артемиды, так что цепочка заодно закрывает «Fashion's Creed».",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]},{text:"Если финальный квест Дафны не появляется, вернитесь в деревню охотниц на Хиосе: Дафна на горе к югу от лагеря. Исход финального боя на трофей не влияет.",spoiler:false,labels:["Не подтверждено"],src:["st123"]}]},{num:32,en:"Everybody Benefits",ru:"Все в выгоде",ruOfficial:true,desc:"Завершить сюжетную линию Маркоса.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"16.2%",rarityLabel:"Rare",stage:"s3",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Маркос сидит в клетке в крепости на Косе (Нагорье Асклепиада): освободите его и отнесите домой — это квест «Возможность заработать» (A Business Opportunity).",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st124"]},{text:"Далее «Старые друзья, старые беды», «Дом в огне» и «Судьба Маркоса»; вся короткая цепочка занимает около 15 минут.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st124"]},{text:"Чтобы не зачищать крепость, заходите с севера: хватит убить пару стражей.",spoiler:false,labels:["Не подтверждено"],src:["st124"]},{text:"У отдельных игроков трофей не выпал ни в первом прохождении, ни в «Новой игре+».",spoiler:false,labels:["Не подтверждено"],src:["st124"]}]},{num:33,en:"Trust Me, I'm a Doctor",ru:"Доверься мне, я доктор",ruOfficial:true,desc:"Завершить сюжетную линию Гиппократа.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"11.9%",rarityLabel:"Very Rare",stage:"s4",missable:false,online:false,buggy:true,grind:false,tips:[{text:"Цепочка Гиппократа в Беотии (с эпизода 7): «Охотничий отряд», «Свободу больным», «Страхование наследства», «Хорошего понемножку».",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st201"]},{text:"Квест может не отображаться на карте, пока не подойдёте вплотную к Гиппократу на севере Фив; помогает сначала закрыть остальные задания Беотии.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st201"]},{text:"После второго квеста следующие появляются не сразу: пропустите время (удержание сенсорной панели), и Гиппократ переберётся в юго-западную часть Фив.",spoiler:false,labels:["Подтверждено"],src:["st201","psn201"]},{text:"Если Гиппократ так и не даёт квест, читатели PowerPyx советуют убить белого элитного кабана у пещеры к северу от города или зачистить акрополь Фив и дом лидера; держите резервные сохранения.",spoiler:false,labels:["Не подтверждено"],src:["pp1"]}]},{num:34,en:"A Pirate's Life for Me",ru:"Пиратская жизнь по мне",ruOfficial:true,desc:"Завершить сюжетную линию Ксении.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"8.9%",rarityLabel:"Very Rare",stage:"s4",missable:false,online:false,buggy:true,grind:false,tips:[{text:"Обязательное условие — побочный квест «Кто нашёл — берёт себе» (Lost and Found) на островке Лестрис к югу от Кеоса; если линия всё равно не стартует, PowerPyx советует закрыть остальные задания на Кеосе и осмотреть в инвентаре обе выданные карты.",spoiler:false,labels:["Подтверждено"],src:["st202","pp1","psn201"]},{text:"Линия Ксении обычно открывается с эпизода 7 (после завершения 6-го); до этого квестодатель молчит, и это не баг.",spoiler:false,labels:["Подтверждено"],src:["st202","st401","pp1","psn101"]},{text:"По комментарию на PSNProfiles, линия может начаться уже с начала эпизода 6.",spoiler:false,labels:["Не подтверждено"],src:["psn201"]},{text:"Ксения даёт несколько карт сокровищ, верна одна — сверяйте с картой мира. Лира Аполлона — в храме Аполлона на Эвбее, Флейта Пана — в куче золота в пещере, а не в сундуках; финал — кража ларца из форта Олурос в Ахее.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp12","psn101","psn201"]},{text:"Линия иногда сбоит: квесты не появляются или трофей не выпадает. Держите резервное сохранение.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn201","st202"]}]},{num:35,en:"Going For Gold",ru:"Претендент на золото",ruOfficial:true,desc:"Завершить сюжетную линию с Олимпийскими играми.",descOfficial:true,type:"silver",hidden:true,dlc:false,group:"Base Game",rarity:"34.0%",rarityLabel:"Rare",stage:"s4",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Олимпийская цепочка начинается сама в эпизоде 7 после задания «Король Спарты» и обязательна по сюжету — пропустить нельзя.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st203"]},{text:"В цепочке четыре квеста (названия в переводе): «Доставка чемпиона» (Delivering a Champion), «Претендент» (The Contender), «Долгая игра» (The Long Game) и «Панкратион» (Pankration); трофей — за завершение всех.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]}]},{num:36,en:"Scourge of the Aegean",ru:"Бич Эгейского моря",ruOfficial:true,desc:"Потопить эпический корабль в первый раз.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"50.2%",rarityLabel:"Common",stage:"s3",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Эпический корабль отмечен жёлтой короной вокруг уровня и встречается в море довольно часто — высматривайте орлом. Обездвижьте его и потопите (абордаж тоже засчитывается).",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st204"]},{text:"Перед боем прокачайте свой корабль; эффективнее всего таран, горящие стрелы и копья.",spoiler:false,labels:["Подтверждено"],src:["psn101","st204"]},{text:"Часто это корабли наёмников и культистов, так что трофей нередко выпадает сам.",spoiler:false,labels:["Не подтверждено"],src:["st204"]}]},{num:37,en:"Blood Sport",ru:"Кровавый спорт",ruOfficial:true,desc:"Победить наемника на арене.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"29.6%",rarityLabel:"Rare",stage:"s7",missable:false,online:false,buggy:false,grind:false,tips:[{text:"На арене в Пефке у управляющего под списком чемпионов иногда есть наёмник (значок шлема): выберите его и победите в коротком бою один на один.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st205"]},{text:"Наёмник на арене бывает не всегда — заглядывайте периодически или поднимайте розыск.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]},{text:"Уровень наёмника обычно близок к вашему; его видно в меню наёмников.",spoiler:false,labels:["Не подтверждено"],src:["st205"]}]},{num:38,en:"Harder, Better, Faster, Stronger",ru:"Мощнее, лучше, быстрее, крепче",ruOfficial:true,desc:"Улучшить \"Адрестию\" в первый раз.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"58.8%",rarityLabel:"Common",stage:"s2",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Достаточно один раз улучшить любой параметр «Адрестии»; по сюжету это придётся сделать рано.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st206"]}]},{num:39,en:"Fashion's Creed",ru:"Дело вкуса",ruOfficial:true,desc:"Надеть полный комплект легендарных доспехов.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"53.2%",rarityLabel:"Common",stage:"s8",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Наденьте все части одного легендарного комплекта брони.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st207"]},{text:"Источники комплектов: цепочка «Дочери Артемиды», полная ветвь культистов, некоторые наёмники, а также задание о войне Спарты и Афин около 35-го уровня (комплект спартанского героя).",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","psn201","st207"]},{text:"Самый быстрый путь — бесплатные легендарные комплекты (Эцио, викинга) из Ubisoft Club.",spoiler:false,labels:["Не подтверждено"],src:["st207"]}]},{num:40,en:"Aphrodite's Embrace",ru:"Объятия Афродиты",ruOfficial:true,desc:"Провести с кем-нибудь ночь.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"53.8%",rarityLabel:"Common",stage:"s2",missable:true,online:false,buggy:false,grind:false,tips:[{text:"Выбирайте в диалогах реплики со значком сердца; пол героя не важен. Если упорно выбирать сердце с одним персонажем, рано или поздно будет ночь.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st208"]},{text:"Самый простой вариант — Алкивиад в Афинах: на симпозиуме Перикла в конце эпизода 4 или в доме Перикла после сюжета. Ранние варианты: цепочка Одессы в Мегариде (флиртуйте во всех ответах) и квест в Фокиде у Парнаса (Age is Just a Number) со шкурами оленя и медведя.",spoiler:false,labels:["Подтверждено"],src:["pp1","st208"]},{text:"Ещё варианты: Миконос («Богиня охоты»), Гидрея (задание перед «Битвой сотни рук»), Китира («Я, Диона»), целитель в Дельфах («Помощь целителю», за Кассандру), линия Ксении.",spoiler:false,labels:["Подтверждено"],src:["st208","pp1","pp12"]},{text:"Формально единственный упускаемый трофей основной игры, но возможностей очень много.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]},{text:"В ближневосточной версии игры однополые романы отключены.",spoiler:false,labels:["Не подтверждено"],src:["pp1"]}]},{num:41,en:"One Head Down…",ru:"Голова с плеч",ruOfficial:true,desc:"Уничтожить ветвь культистов.",descOfficial:true,type:"silver",hidden:true,dlc:false,group:"Base Game",rarity:"35.0%",rarityLabel:"Rare",stage:"s3",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Убейте всех рядовых культистов любой одной ветви; подробности — в «The Cult Unmasked».",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]},{text:"Проще всего закрыть ветвь «Глаза Космоса»: Эльпенор убивается по сюжету, остальных нужно найти — Сотеру в форте Мегариды, Хозяина и Гермиппа в побочных заданиях Аттики, Мидаса в Арголиде, мудреца Нюкс в Афинах.",spoiler:false,labels:["Подтверждено"],src:["pp4","psn101"]},{text:"Один игрок получил этот трофей вместе с наградой за эпизод 6.",spoiler:false,labels:["Не подтверждено"],src:["st209"]}]},{num:42,en:"Birthright",ru:"Право по рождению",ruOfficial:true,desc:"Добраться до Атлантиды и поговорить с Пифагором.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"35.6%",rarityLabel:"Rare",stage:"s4",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужен квест «Семейное наследие» (A Family's Legacy) на Фере: он открывается в эпизоде 7 после задания «Единый фронт» (United Front), рекомендуемый уровень 27.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp8","pp18","psn101","st210"]},{text:"Главное — головоломка с зеркалами: найдите орлом табличку, двигайте стойки и разбивайте преграды (часть зеркал закрыта тряпками или досками), чтобы центральный луч попал в большую дверь; затем лавовые залы и разговор с Пифагором. Есть видеогайды.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp18","psn101","st210","st408"]},{text:"После разговора Атлантида становится точкой быстрого перемещения и открывается цепочка квестов к мифическим боссам.",spoiler:false,labels:["Не подтверждено"],src:["pp8","pp18"]},{text:"Раньше дверь в Атлантиду могла не открываться из-за бага, который позже исправили.",spoiler:false,labels:["Не подтверждено","Устарело?"],src:["st408"]}]},{num:43,en:"Ramming Speed",ru:"Таранный разгон",ruOfficial:true,desc:"Расколоть корабль надвое.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"59.4%",rarityLabel:"Common",stage:"s2",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Ослабьте вражеский корабль, не беря его на абордаж, разгонитесь (удерживайте X) и тараньте в подсвеченную середину — он расколется надвое; иногда нужно несколько таранов.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st211"]},{text:"Проще всего на маленьких торговых судах; можно уже в обучающем морском квесте: расстреляйте корабль до половины здоровья, отплывите и разгонитесь.",spoiler:false,labels:["Не подтверждено"],src:["st211"]},{text:"С женским экипажем тот же таран сразу даёт и «Wrath of the Amazons».",spoiler:false,labels:["Подтверждено"],src:["pp1","st211","st218"]}]},{num:44,en:"I Have the Power",ru:"Ярость кипит во мне",ruOfficial:true,desc:"Выполните яростный удар при помощи всех видов оружия.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"15.8%",rarityLabel:"Rare",stage:"s3",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Откройте навыки «Яростные удары» (Overpower Attacks, ветка Воина) и «Подавляющий выстрел» (Overpower Bow Strike, ветка Охотника) — хватит первого ранга. Приём (R1+R2, с луком при зажатом L2) тратит три сегмента адреналина.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st212"]},{text:"По проверке на Stratege.ru хватает четырёх видов оружия: меч, тяжёлое оружие (молот, топор и булава считаются одним), лук и копьё или посох; кинжал не нужен.",spoiler:false,labels:["Не подтверждено"],src:["st212"]},{text:"PowerPyx и PSNProfiles называют семь видов: меч, кинжал, тяжёлое дробящее, тяжёлое режущее, посох, копьё, лук; безоружный приём не нужен. Надёжнее сделать все семь.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]},{text:"Убивать приёмом не обязательно, но по врагу нужно попасть.",spoiler:false,labels:["Не подтверждено"],src:["st212"]},{text:"По комментарию на PSNProfiles, ни бой, ни попадание не нужны — достаточно выполнить приём каждым оружием.",spoiler:false,labels:["Не подтверждено"],src:["psn201"]}]},{num:45,en:"War Master",ru:"Мастер войны",ruOfficial:true,desc:"Убить предводителя любого региона с низким уровнем ресурсов, кроме Мегариды.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"46.4%",rarityLabel:"Rare",stage:"s3",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Ослабляйте любой регион, кроме Мегариды: убивайте солдат правящей стороны, жгите военные припасы факелом, грабьте казну в фортах; затем убейте предводителя (значок с перьями, может убегать).",spoiler:false,labels:["Подтверждено"],src:["pp1","pp17","psn101","st213"]},{text:"Обнулять шкалу не обязательно: как только появится сообщение, что предводитель уязвим и можно начать битву за территорию, идите его убивать.",spoiler:false,labels:["Не подтверждено"],src:["st213"]},{text:"PowerPyx и PSNProfiles советуют довести фиолетовую шкалу силы до нуля и только потом убивать предводителя.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]},{text:"Удобны небольшие регионы: Малида (самая низкая защищённость) или остров Кос.",spoiler:false,labels:["Подтверждено"],src:["st213","pp1"]},{text:"Если довели защиту до нуля, сразу идите к предводителю — иначе битва за территорию пройдёт без вас и защита вернётся к 100%.",spoiler:false,labels:["Не подтверждено"],src:["st213"]}]},{num:46,en:"Misthios in Training",ru:"Начинающий наемник",ruOfficial:true,desc:"Выполнить 20 заданий для охотников за головами, контрактов или морских заданий с доски объявлений.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"18.5%",rarityLabel:"Rare",stage:"s3",missable:false,online:false,buggy:false,grind:false,tips:[{text:"По опыту игроков Stratege.ru, нужен хотя бы один контракт каждого вида — охота за головами, обычный и морской; у одного трофей выпал только после первого морского.",spoiler:false,labels:["Не подтверждено"],src:["st214"]},{text:"PowerPyx и PSNProfiles: подходят любые 20 заданий с досок объявлений, вид не важен.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]},{text:"Берите все контракты на каждой доске: многие выполняются сами по ходу игры, доски регулярно обновляются; обычные побочные квесты не считаются.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st214"]},{text:"У части игроков счётчик не срабатывал и после 20+ контрактов; одному помогла новая игра.",spoiler:false,labels:["Не подтверждено"],src:["pp1"]}]},{num:47,en:"Island Hopper",ru:"Между островами",ruOfficial:true,desc:"Завершить 20 заданий на Пефке, Обсидиановых островах и островах Абанта.",descOfficial:true,type:"gold",hidden:false,dlc:false,group:"Base Game",rarity:"15.3%",rarityLabel:"Rare",stage:"s6",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужно 20 побочных квестов (не контрактов и не заданий с досок) на Пефке, Обсидиановых островах (Гидрея и Милос) и островах Абанта (Эвбея и Скирос); всего их около 23.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp9","psn101","st215"]},{text:"Желательно сначала Гидрея, потом Милос: после квестов на Милосе задания Гидреи пропадают. Если порядок нарушен, трофей не потерян, остаётся 20 квестов, но тогда обязательно пройдите арену Пефки (все её бои считаются одним квестом).",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st215"]},{text:"Бои на арене Пефки (пять чемпионов) идут в зачёт.",spoiler:false,labels:["Не подтверждено"],src:["st215"]},{text:"По PSNProfiles и PowerPyx, все бои на арене засчитываются как один квест.",spoiler:false,labels:["Подтверждено"],src:["psn101","pp1"]},{text:"Заранее откройте эти области и синхронизируйте точки обзора; если всё сделано, а трофея нет, облетите острова орлом в поисках неотмеченного задания.",spoiler:false,labels:["Подтверждено"],src:["pp1","st215"]}]},{num:48,en:"Infamous",ru:"Дурная репутация",ruOfficial:true,desc:"Добиться того, чтобы за вашу голову назначили максимальную награду.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"38.7%",rarityLabel:"Rare",stage:"s2",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужен максимальный розыск — пять шлемов справа внизу. Быстрее всего напасть на большой форт или предводителя с охраной, убивать мирных или воровать при свидетелях.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st216"]},{text:"Не платите выкуп и не убивайте того, кто назначил награду, — розыск упадёт.",spoiler:false,labels:["Не подтверждено"],src:["pp1"]},{text:"По сюжету в Спарте за голову героя назначают максимальную награду, и трофей может выпасть сам.",spoiler:false,labels:["Не подтверждено"],src:["st216"]},{text:"Удобное место — священная равнина Деметры в Аттике: много складов, которые можно обворовывать при людях.",spoiler:false,labels:["Не подтверждено"],src:["st216"]}]},{num:49,en:"Hero for Hire",ru:"Герой по найму",ruOfficial:true,desc:"Выиграть первое сражение за любой регион (кроме Мегариды в странствиях героя).",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"47.2%",rarityLabel:"Rare",stage:"s3",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Снизьте силу любого региона до трети (солдаты, припасы, казна, лидер) — появятся флаги; поговорите с генералом одной из сторон и выиграйте битву за завоевание.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp7","psn101"]},{text:"Сюжетная битва в Мегариде не считается, но после неё можно снова ослабить Мегариду и выиграть там ещё одну битву — она засчитывается.",spoiler:false,labels:["Подтверждено"],src:["st217","psn201"]},{text:"Хитрость PowerPyx: если открыть всю карту, битвы сами регулярно идут в разных регионах, и сбивать силу не нужно; ради опыта выбирайте нападающую сторону на «сложно».",spoiler:false,labels:["Не подтверждено"],src:["pp1","pp7"]},{text:"В бою убивайте прежде всего значимых противников — рядовые почти не двигают шкалу.",spoiler:false,labels:["Не подтверждено"],src:["st217"]},{text:"Иногда трофей не выпадал после нескольких битв и пришёл лишь после битвы за Ахею на стороне Афин.",spoiler:false,labels:["Не подтверждено"],src:["st217"]}]},{num:50,en:"Wrath of the Amazons",ru:"Гнев амазонок",ruOfficial:true,desc:"Расколоть корабль противника, когда ваша команда состоит только из женщин.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"24.3%",rarityLabel:"Rare",stage:"s3",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Расколите корабль тараном, когда в настройках корабля выбран женский вариант экипажа; лейтенанты-женщины и полная прокачка корабля не нужны.",spoiler:false,labels:["Подтверждено"],src:["pp1","pp3","psn201","st218"]},{text:"Проще всего взять бесплатный набор женских ассасинов из Ubisoft Club, выбрать его и расколоть первый корабль — заодно выпадет «Ramming Speed».",spoiler:false,labels:["Подтверждено"],src:["pp1","st218","psn201"]},{text:"Набор разбойниц лежит в подводной локации у юго-запада Делоса (затонувший корабль Датиса); женские экипажи дают также Олимпийская цепочка и «Дочери Артемиды».",spoiler:false,labels:["Подтверждено"],src:["pp1","pp3","st218","psn201"]},{text:"Настоящих женщин в команду можно набрать, например, через цепочку Одессы в Мегариде, но для трофея это не обязательно.",spoiler:false,labels:["Не подтверждено"],src:["st218"]}]},{num:51,en:"The Midas Touch",ru:"Прикосновение Мидаса",ruOfficial:true,desc:"Нанести легендарную гравировку на легендарное оружие.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"35.7%",rarityLabel:"Rare",stage:"s8",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужно два легендарных предмета с разными легендарными эффектами: у кузнеца в разделе «Гравировка» прокрутите до жёлтых эффектов и перенесите эффект одного на другой.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","st219"]},{text:"Легендарные гравировки открываются от новых легендарок — чаще всего за культистов и с ростом уровня; с бронёй тоже можно, но не все эффекты совместимы.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101"]}]},{num:52,en:"The Show Must Go On",ru:"Вина и зрелищ",ruOfficial:true,desc:"Завершите задание \"Вина и зрелищ\"",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Additional Feats",rarity:"14.3%",rarityLabel:"Very Rare",stage:"s10",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Цепочка начинается в Элиде: подойдите к синему маркеру у порта и поговорите с Фесписом, первое задание — «Все на сцену».",spoiler:false,labels:["Подтверждено"],src:["psn102","st220"]},{text:"Задания идут по порядку: «Все на сцену» (The Show Must Go On), «Напиток для всех» (Everyman's Drink), «Уравнять шансы» (Evening the Odds), «Проклятие славы» (The Curse of Fame), «Метод гедониста» (The Hedonistic Method) и «Представление» (Showtime); названия, кроме первого, даны в переводе. Нужно добыть вино для зрителей, уладить дело с командиром-кредитором, спасти и вернуть актёров и поставить пьесу.",spoiler:false,labels:["Не подтверждено"],src:["psn102"]},{text:"Изысканное вино лежит в плетёной корзине в пещере у камня, рядом с беседующими солдатами. Вход в пещеру — с восточной стороны, под деревянным настилом за стенами крепости.",spoiler:false,labels:["Не подтверждено"],src:["st220"]},{text:"Рекомендуемый уровень видно при наведении на маркер; при включённой автоподстройке уровня задания подстраиваются под вас.",spoiler:false,labels:["Не подтверждено"],src:["psn102"]}]},{num:53,en:"Lightning Rod",ru:"Гром и молния",ruOfficial:true,desc:"Одолейте Стеропа Молниеносца.",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Additional Feats",rarity:"25.5%",rarityLabel:"Rare",stage:"s10",missable:false,online:false,buggy:true,grind:false,tips:[{text:"Задание на циклопа Стеропа «Несущий молнию» (The Lightning Bringer) выдаётся автоматически и ведёт в бухту на острове Андрос, у кладбища разбитых кораблей. Трофей выпадает сразу после победы.",spoiler:false,labels:["Подтверждено"],src:["psn102","st221"]},{text:"Тактика: всё время двигайтесь и держитесь у него за спиной, бейте ядом и огнём — лучше всего огненными стрелами из лука издалека.",spoiler:false,labels:["Подтверждено"],src:["psn102","st221"]},{text:"Не забирайтесь во время боя на обломки корабля рядом с ареной: урон, нанесённый боссу, сбросится, и бой придётся начинать заново.",spoiler:false,labels:["Не подтверждено"],src:["st221"]},{text:"Известный баг на PS и Xbox: Стероп и Арг могут вовсе не появиться, как и их задания. Обход: ручное сохранение в бухте, запуск игры без интернета, перемещение в любую другую область Греции, затем включите сеть, не выходя из игры, и вернитесь в бухту.",spoiler:false,labels:["Не подтверждено"],src:["st221","st223"]}]},{num:54,en:"Divine Intervention",ru:"Божественное вмешательство",ruOfficial:true,desc:"Завершите задание \"Божественное вмешательство\"",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Additional Feats",rarity:"18.9%",rarityLabel:"Rare",stage:"s10",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Цепочку выдаёт таинственная женщина в Коринфии (синий маркер); по Stratege.ru она стоит на равнинах Краниона у храма Афродиты, рядом со статуей, к востоку от Коринфа.",spoiler:false,labels:["Подтверждено"],src:["psn102","st222"]},{text:"Цепочка из четырёх испытаний характера и суждения: «Испытание суждения» (Test of Judgment), «Испытание характера» (Test of Character), «Испытание приспособляемости» (Test of Adaptability) и последнее — «Испытание смелости» (Test of Courage). В гайде PSNProfiles финальное задание указано ошибочно.",spoiler:false,labels:["Подтверждено"],src:["psn102","psn202","st222"]},{text:"В «Испытании смелости» в Кузнице Гефеста доступны только два сундука (с оружием и сюжетный) — за заваленную дверь пройти нельзя. Дальнейший путь зависит от выбора: с Аполлоном — проход слева к статуе льва, с Посейдоном — справа.",spoiler:false,labels:["Не подтверждено"],src:["st222"]}]},{num:55,en:"Volcanic Sunscreen",ru:"Вулканическая защита",ruOfficial:true,desc:"Победите Арга Сияющего",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Additional Feats",rarity:"18.6%",rarityLabel:"Rare",stage:"s10",missable:false,online:true,buggy:true,grind:false,tips:[{text:"Арг Сияющий живёт на острове Нисирос в Вулканических островах на юго-востоке карты; задание «Сияющий» выдаётся автоматически и висит в разделе охоты за головами.",spoiler:false,labels:["Подтверждено"],src:["psn102","st223"]},{text:"Чтобы задание появилось в списке, нужно подключение к сети; после его появления интернет можно отключить.",spoiler:false,labels:["Не подтверждено"],src:["st223"]},{text:"Тактика как против Стеропа: держитесь сзади, кружите вокруг и бейте ядом и огнём (огонь наносит ему больше урона, чем оружие). Горение будет постоянным, поэтому часто перекатывайтесь и лечитесь при каждой возможности.",spoiler:false,labels:["Подтверждено"],src:["psn102","st223"]},{text:"Уровень циклопа растёт вместе с вашим: перед боем улучшите снаряжение до максимума и нанесите легендарные гравировки на урон и броню.",spoiler:false,labels:["Не подтверждено"],src:["st223"]},{text:"Если Арг не появляется, это тот же баг, что и со Стеропом: помогает запуск сохранения в бухте без интернета с последующим включением сети (подробнее в трофее «Гром и молния»).",spoiler:false,labels:["Не подтверждено"],src:["st221","st223"]}]},{num:56,en:"The Image of Faith",ru:"Образ веры",ruOfficial:true,desc:"Завершите задание \"Образ веры\"",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Additional Feats",rarity:"14.4%",rarityLabel:"Very Rare",stage:"s10",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Цепочка начинается в Элиде у маркера с Поликлетом: нужно помочь людям на небольшой плантации.",spoiler:false,labels:["Не подтверждено"],src:["psn102"]},{text:"Шесть коротких заданий: «Мера человека» (The Measure of a Man), «С высоты» (Down From On High), «Плохая трава» (Bad Weed), «Дикая охота» (The Wild Hunt), «Курица или яйцо» (Chicken or Egg) и «Дело веры» (A Matter of Faith); русские названия даны в переводе.",spoiler:false,labels:["Подтверждено"],src:["psn102","st224"]}]},{num:57,en:"The Daughters of Lalaia",ru:"Дочери Лалаи",ruOfficial:true,desc:"Завершите задание \"Дочери Лалаи\"",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Additional Feats",rarity:"18.1%",rarityLabel:"Rare",stage:"s10",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Цепочка начинается в Фокиде у Периктионы: нужно защитить деревню от персов.",spoiler:false,labels:["Не подтверждено"],src:["psn102"]},{text:"Шесть заданий, которые называют оба сайта: «Надвигающаяся буря» (A Gathering Storm), «Острые уроки» (Sharp Lessons), «Изучая землю» (Learning the Land), «Руда Афродиты» (The Ore of Aphrodite), «Лучшая защита» (The Best Defense) и «Кровь для Афродиты» (Blood for Aphrodite); русские названия даны в переводе. Вся цепочка занимает около 25 минут.",spoiler:false,labels:["Подтверждено"],src:["psn102","st225"]},{text:"По PSNProfiles, в цепочку входит и седьмое задание — «Романтика» (Romance); в списке Stratege.ru (2019) оно не упомянуто, поэтому после шестого не останавливайтесь, пока трофей не выпал.",spoiler:false,labels:["Не подтверждено"],src:["psn102"]}]},{num:58,en:"A Poet's Legacy",ru:"Наследие поэта",ruOfficial:true,desc:"Завершите задание \"Наследие поэта\"",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Additional Feats",rarity:"13.0%",rarityLabel:"Very Rare",stage:"s10",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Цепочка из четырёх заданий в Беотии, недалеко от порта Кревсис; квестодатель — Алкивиад.",spoiler:false,labels:["Подтверждено"],src:["psn102","st226"]},{text:"Порядок и суть: «Почитатель Праксиллы» (Praxilla's Admirer) — нарвать 5 коралловых роз; «Лира, лира» (Lyre lyre) — осмотреть лагерь и освободить пленника; «Починка лиры» (Repairing the lyre) — сопроводить Праксиллу и добыть по 3 волчьих кишки, раковины и куска древесины плакучей берёзы; «Наследие Праксиллы» (Praxilla's Legacy) — защитить её от разбойников. Русские названия даны в переводе.",spoiler:false,labels:["Подтверждено"],src:["psn102","st226"]}]},{num:59,en:"A Brother's Seduction",ru:"Братский соблазн",ruOfficial:true,desc:"Завершите задание \"Братский соблазн\"",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Additional Feats",rarity:"18.1%",rarityLabel:"Rare",stage:"s10",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Цепочка начинается на северо-востоке Коринфии у Алтаря Циклопов, квестодатель — Ликин.",spoiler:false,labels:["Подтверждено"],src:["psn102","st227"]},{text:"Семь заданий: «Возвращение блудного сына» (Prodigal Son's Return), «Кровавое возлияние» (Bloody Libation), «Наряд для Харона» (Dressing up for Charon), «Почтить мёртвых» (Honoring the Dead), «Выбор профессии» (Career Orientation), «Раны былых дней» (Wounds of Days Gone By), «Жизнь продолжается» (Moving On); русские названия даны в переводе.",spoiler:false,labels:["Не подтверждено"],src:["psn102"]},{text:"По ходу нужно спасти Ликина, добыть доспех его отца, разобраться с бандитами, поохотиться на оленей и выйти на дуэль.",spoiler:false,labels:["Не подтверждено"],src:["psn102"]}]},{num:60,en:"A Friend Worth Dying For",ru:"Друг, ради которого стоит умереть",ruOfficial:true,desc:"Завершите задание \"Друг, ради которого стоит умереть\"",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Additional Feats",rarity:"17.8%",rarityLabel:"Rare",stage:"s10",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Цепочка начинается на острове Скирос у Варнавы.",spoiler:false,labels:["Подтверждено"],src:["psn102","st228"]},{text:"Задания: «Одиссея в прошлое» (Odyssey Into the Past), «Берегись зова сирены» (Beware the Siren Call), «Быть Никем» (To Be Nobody), «Вино для свиней» (Wine for the Swine), «Папа дома» (Daddy's Home); русские названия даны в переводе.",spoiler:false,labels:["Не подтверждено"],src:["psn102"]},{text:"У цепочки есть продолжение: если сжечь амбары и сказать Леде, что такова воля Деметры, дочь Варнавы присоединится к команде «Адрестии» как легендарный лейтенант.",spoiler:false,labels:["Не подтверждено"],src:["st228"]}]},{num:61,en:"The Heir of Memories",ru:"Наследница Памяти",ruOfficial:true,desc:"Завершите задание \"Наследница Памяти\"",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Additional Feats",rarity:"17.1%",rarityLabel:"Rare",stage:"s10",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Первое задание — на небольшом острове со статуей Посейдона к северу от Самоса (между Самосом и Хиосом, восток карты): нажмите на синий маркер по прибытии.",spoiler:false,labels:["Подтверждено"],src:["psn102","st229"]},{text:"Задания: «Наследница Памяти» (The Heir of Memories), «В поисках Тераса» (Finding Theras), «Три погребённых символа» (Three Symbols Entombed), «Символ Агамемнона» (Agamemnon's Symbol), «Символ Этеокла» (Eteokles Symbol), «Символ Ориона» (Orion's Symbol); названия, кроме первого, даны в переводе.",spoiler:false,labels:["Не подтверждено"],src:["psn102"]},{text:"Цепочку добавили обновлением 1.2.0; она переключает действие между современностью и древностью и подводит к дополнению «Судьба Атлантиды».",spoiler:false,labels:["Подтверждено"],src:["psn102","st229"]}]},{num:62,en:"One Really, Really Bad Day",ru:"Очень, очень плохой день",ruOfficial:true,desc:"Завершите задание \"Очень, очень плохой день\"",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Additional Feats",rarity:"13.8%",rarityLabel:"Very Rare",stage:"s10",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Цепочка начинается в Локриде (не в Лаконии) у Мегакла.",spoiler:false,labels:["Подтверждено"],src:["psn102","st230"]},{text:"Комичная история о защите города от пиратов: «Исправить ошибку» (Righting a Wrong), «Слепой кузнец» (The Blind Blacksmith), «Конечно, конь» (A Horse, of Course), «Аякс в огне» (Ajax on Fire), «Здесь пираты» (Here Be Pirates), «Останется только один» (There Can Be Only One); русские названия даны в переводе.",spoiler:false,labels:["Не подтверждено"],src:["psn102"]}]},{num:63,en:"Every Story Has an Ending",ru:"У каждой истории есть конец",ruOfficial:true,desc:"Завершите задание \"У каждой истории есть конец\"",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Additional Feats",rarity:"13.5%",rarityLabel:"Very Rare",stage:"s10",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Трофей не выпадет до конца основного сюжета: последний разговор с Геродотом открывается только после задания Сократа «Мы помним», которое появляется после финала и зачистки культистов. Если цепочка пройдена, а трофея нет, — дело в этом.",spoiler:false,labels:["Подтверждено"],src:["psn102","st231"]},{text:"Цепочка начинается у причала с Геродотом (обычно в Фокиде, встречали и в Элиде) и ведёт на Самос: «Письмо домой» (Letter for Home), «Сожаления» (Regrets), «Последователи истины» (Followers of Truth), «Семейные ценности» (Family Values), «Защита Самоса» (Defense of Samos), «Двигаясь дальше» (Moving Forward); русские названия даны в переводе.",spoiler:false,labels:["Не подтверждено"],src:["psn102"]},{text:"Цепочка не появится на карте, пока не выполнено побочное задание «Врата Атлантиды» (The Gates of Atlantis).",spoiler:false,labels:["Не подтверждено"],src:["psn202"]},{text:"Не путайте с самим дополнением: задание на трофей — разговор Варнавы и Геродота на берегу, который следует за сценой у входа в Атлантиду, где герой получает посох.",spoiler:false,labels:["Не подтверждено"],src:["st231"]},{text:"Трофей добавили обновлением в середине 2019 года; если задание не появляется, обновите игру и проверьте список установленных дополнений в меню магазина.",spoiler:false,labels:["Не подтверждено","Устарело?"],src:["st407"]}]},{num:64,en:"Old Flames Burn Brighter",ru:"Старое пламя горит ярче",ruOfficial:true,desc:"Завершите задание \"Старое пламя горит ярче\"",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Additional Feats",rarity:"11.1%",rarityLabel:"Very Rare",stage:"s10",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Цепочка начинается в Аркадии, на ферме Анаис в Лесу Сорон; первое задание «Начнём сначала» появится в журнале после встречи с ней, когда начнётся 5-й эпизод основной кампании.",spoiler:false,labels:["Подтверждено"],src:["psn102","st301"]},{text:"Задания: «Начнём сначала» (Where We Left Off), «Беглянка» (Runaway), «Незапланированное родительство» (Unplanned Parenthood), «Ночь в Тегее» (A Night in Tegea); названия, кроме первого, даны в переводе.",spoiler:false,labels:["Не подтверждено"],src:["psn102"]},{text:"Цепочку можно пройти и после основного сюжета. После первого задания следующие пропадают из журнала, но остаются на карте мира — ищите их там.",spoiler:false,labels:["Не подтверждено"],src:["st301"]},{text:"Трофей добавили обновлением в августе 2019 года; если задания нет на карте, а обновлений «нет», проверьте установленные дополнения в меню магазина или перезапустите игру.",spoiler:false,labels:["Не подтверждено","Устарело?"],src:["st407"]}]},{num:65,en:"Lone Lion",ru:"Одинокий лев",ruOfficial:true,desc:"Убейте македонского льва.",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Legacy of the First Blade: Episode 1",rarity:"3.0%",rarityLabel:"Ultra Rare",stage:"s11",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Македонский лев стоит в паре шагов от точки быстрого перемещения «Гора Афон» в Македонии — телепортируйтесь туда и подойдите к нему.",spoiler:false,labels:["Подтверждено"],src:["psn103","st302"]},{text:"Лев не слишком силён; проще всего подкрасться и нанести критическое скрытое убийство (урон зависит от ранга умения и урона убийцы).",spoiler:false,labels:["Не подтверждено"],src:["psn103"]}]},{num:66,en:"Without a Trace",ru:"Без следа",ruOfficial:true,desc:"Убейте 10 противников, используя способность \"Завеса смерти\".",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Legacy of the First Blade: Episode 1",rarity:"10.0%",rarityLabel:"Very Rare",stage:"s11",missable:false,online:false,buggy:false,grind:false,tips:[{text:"С умением «Завеса смерти» (Death Veil) тела врагов, убитых скрытно, исчезают. Подкрадитесь сзади или ждите в засаде: если полоска здоровья врага целиком красная, хватит нажатия Треугольника, иначе удерживайте его (тратится адреналин).",spoiler:false,labels:["Подтверждено"],src:["psn103","st303"]},{text:"Быстрее всего — «Стремительная внезапная атака» (Rush Assassinate) с клинком «Гордость льва»: её убийства тоже засчитываются, и 10 врагов можно убить за один заход, заодно получив «Выйти за рамки».",spoiler:false,labels:["Подтверждено"],src:["psn103","st303"]},{text:"Сильного врага можно сначала ранить и спрятаться, а когда он успокоится, добить скрытным убийством.",spoiler:false,labels:["Не подтверждено"],src:["st303"]},{text:"Счётчик может пополниться неожиданно: у одного игрока трофей выпал в первом эпизоде «Судьбы Атлантиды», когда рассыпались тела стражей ису.",spoiler:false,labels:["Не подтверждено"],src:["psn203"]}]},{num:67,en:"The Start of a Legacy",ru:"Начало наследия",ruOfficial:true,desc:"Узнайте правду о прошлом Дария.",descOfficial:true,type:"bronze",hidden:true,dlc:true,group:"Legacy of the First Blade: Episode 1",rarity:"8.6%",rarityLabel:"Very Rare",stage:"s11",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Сюжетный и неупускаемый: выпадает после пяти основных заданий первого эпизода — «Всадники грядут» (The Horsemen Cometh), «Тень легенды» (Shadow of a Legend), «Больше вопросов, чем ответов» (More Questions than Answers), «Охота на охотника» (Hunting the Huntsman) и «Защитник Персии» (Protector of Persia); названия, кроме второго, даны в переводе.",spoiler:false,labels:["Не подтверждено"],src:["psn103"]}]},{num:68,en:"Breaking the Limit",ru:"Выйти за рамки",ruOfficial:true,desc:"Убейте 4 врагов подряд с помощью стремительной внезапной атаки, используя \"Гордость льва\"",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Legacy of the First Blade: Episode 1",rarity:"3.1%",rarityLabel:"Ultra Rare",stage:"s11",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужен меч «Гордость льва» (его дают за сюжетное задание «Тень легенды») и прокачанная «Стремительная внезапная атака» — по PSNProfiles, 3-го уровня.",spoiler:false,labels:["Подтверждено"],src:["psn103","st305"]},{text:"Удобное место — небольшой «Военный лагерь Ишагора» рядом с точкой «Каменная арка» в Македонии: стража стоит кучно, у входа сразу двое. Подходите сбоку и начинайте с ближайшего.",spoiler:false,labels:["Подтверждено"],src:["psn103","st305"]},{text:"Убивать врагов не обязательно: достаточно непрерывной цепочкой атаки задеть четырёх людей (на животных не работает). Выбирайте слабых, например лучников.",spoiler:false,labels:["Подтверждено"],src:["psn103","st305"]},{text:"По наблюдению одного игрока, первый удар серии не учитывается: если враги умирают с одного удара, цепочку придётся тянуть до пятого.",spoiler:false,labels:["Не подтверждено"],src:["st305"]}]},{num:69,en:"Predator and Prey",ru:"Хищник и добыча",ruOfficial:true,desc:"Убейте всех Древних из Ордена Охотников в Македонии.",descOfficial:true,type:"silver",hidden:false,dlc:true,group:"Legacy of the First Blade: Episode 1",rarity:"7.7%",rarityLabel:"Very Rare",stage:"s11",missable:true,online:false,buggy:true,grind:true,tips:[{text:"Работает как охота на культистов: все цели — Древние Ордена Охотников в Македонии, улики ищутся в убежищах и заданиях. Бубарес Заговорщик и Пактий Охотник убиваются по сюжету; Акантха Обманщица — в доме лидера в Амфиполе (улика в комнате у хранилища в форте Олинф), в бою убегает, так что держите наготове лук или стремительную атаку.",spoiler:false,labels:["Не подтверждено"],src:["psn103"]},{text:"Фратагуна Хранительница: улика в убежище у «Каменной арки», сама — в медвежьем логове на севере Македонии; медведей отстреливайте из лука по одному и заберите их шкуры. После неё откроется Конон Боец в лагере «Жертва девяти Ксеркса» у Амфиполя.",spoiler:false,labels:["Подтверждено"],src:["psn103","st306"]},{text:"Эхион Наблюдатель: улики в убежище у «Каменной арки» и в задании «Мертвец восстаёт» (Dead Man Rises) — отдайте кузнецу 5 медвежьих шкур и на вопрос о пароле выберите «Мы — Орден» (We are the Order). Сам Эхион — к северу от Амфиполя.",spoiler:false,labels:["Подтверждено"],src:["psn103","st306"]},{text:"Тимоса Врачевательница связана с заданием «Загадочная хворь» (Mysterious Malady) в Потидее: выберите врача — она и есть Древняя, убейте её сразу. Если выбрать магистрата, Тимоса исчезает, и её придётся искать: вторая улика лежит у печи в военном лагере Аристея (болота Термеса), а сама она прячется в «Прибрежном убежище» у границы с Малидой.",spoiler:true,labels:["Подтверждено"],src:["st306","psn203","psn103"]},{text:"Не давайте Тимосе сбежать и добейте её при первой возможности: у одного игрока она ушла за край карты, и трофей стал недоступен.",spoiler:false,labels:["Не подтверждено"],src:["st306"]}]},{num:70,en:"Rain of Arrows",ru:"Дождь стрел",ruOfficial:true,desc:"Убейте 10 противников, используя способность \"Стрельба навскидку\".",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Legacy of the First Blade: Episode 2",rarity:"1.9%",rarityLabel:"Ultra Rare",stage:"s11",missable:false,online:false,buggy:false,grind:false,tips:[{text:"«Стрельба навскидку» (Rapid Fire) — умение ветки Охотника; полностью прокачивать его не нужно, очки умений можно сбросить. Ослабьте группу основным оружием (начните со слабых, например лучников) и добивайте умением.",spoiler:false,labels:["Не подтверждено"],src:["psn104"]},{text:"Убийства животных (волков, медведей, рысей) тоже засчитываются.",spoiler:false,labels:["Подтверждено"],src:["psn104","st307"]}]},{num:71,en:"Fire on Water",ru:"Огонь на воде",ruOfficial:true,desc:"Подожгите 10 вражеских кораблей.",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Legacy of the First Blade: Episode 2",rarity:"4.9%",rarityLabel:"Ultra Rare",stage:"s11",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужно поджечь 10 военных кораблей — афинских, спартанских или пиратских; торговые не считаются, топить корабли не обязательно.",spoiler:false,labels:["Не подтверждено"],src:["psn104"]},{text:"По сюжету перед последним боем эпизода будет морское сражение с четырьмя кораблями, после которого «Адрестия» получит огнемёт на носу. Тараньте врага и сразу удерживайте R2 — корабль загорится.",spoiler:false,labels:["Подтверждено"],src:["psn104","st308"]},{text:"Огнемёт не обязателен: подойдут огненные стрелы и копья (удерживайте прицеливание и выстрел); лучше выбирать небольшие корабли — крупные загораются реже.",spoiler:false,labels:["Подтверждено"],src:["psn104","st308"]},{text:"Поджог засчитан, когда шкала огня над здоровьем корабля заполнилась и значок огня оказался в белом круге — корабль на время остановится.",spoiler:false,labels:["Подтверждено"],src:["psn104","st308"]},{text:"Ещё вариант: полностью прокачайте таран, тараньте пиратов и сразу после удара поджигайте.",spoiler:false,labels:["Не подтверждено"],src:["st308"]}]},{num:72,en:"Parry to Carry",ru:"Больше жизни",ruOfficial:true,desc:"Восстановите запас здоровья после парирования с помощью \"Правосудие льва\" 10 раз.",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Legacy of the First Blade: Episode 2",rarity:"2.1%",rarityLabel:"Ultra Rare",stage:"s11",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Оружие «Правосудие льва» (Judgement of the Lion) дают за победу над Бурей в сюжетном задании «Пасть Левиафана» (Leviathan's Maw).",spoiler:false,labels:["Подтверждено"],src:["psn104","st309"]},{text:"Экипируйте его, найдите любого врага или наёмника, дайте ему замахнуться и парируйте (L1+R1 в момент удара) — нужно 10 удачных парирований.",spoiler:false,labels:["Подтверждено"],src:["psn104","st309"]},{text:"Терять здоровье не обязательно: парирование засчитывается и при полном запасе.",spoiler:false,labels:["Не подтверждено"],src:["st309"]}]},{num:73,en:"Blood of Leonidas",ru:"Род Леонида",ruOfficial:true,desc:"Продолжение рода.",descOfficial:true,type:"bronze",hidden:true,dlc:true,group:"Legacy of the First Blade: Episode 2",rarity:"7.3%",rarityLabel:"Very Rare",stage:"s11",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Сюжетный и неупускаемый: выдаётся за прохождение второго эпизода, последнее основное задание — «Дом» (Home).",spoiler:false,labels:["Подтверждено"],src:["psn104","st310"]}]},{num:74,en:"Stormculler",ru:"Укротитель бури",ruOfficial:true,desc:"Убейте всех Древних из Ордена Охотников в Ахее.",descOfficial:true,type:"silver",hidden:false,dlc:true,group:"Legacy of the First Blade: Episode 2",rarity:"6.6%",rarityLabel:"Very Rare",stage:"s11",missable:false,online:false,buggy:false,grind:true,tips:[{text:"Нужно убить пятерых Древних Ахеи (в английской версии — Орден Бури, Order of the Storm); как и культистов, их находят по уликам и заданиям, двое убиваются по сюжету.",spoiler:false,labels:["Не подтверждено"],src:["psn104"]},{text:"Софос Посредник (Sophos the Broker): улика на мертвеце в затонувшем корабле в подводной «Бухте кораблекрушений» (Shipwreck Cove), сам — на соседней военной верфи Патр (Patrai Military Shipyard).",spoiler:false,labels:["Не подтверждено"],src:["psn104"]},{text:"Нестор Грозный: улика на столе у хранилища в форте Олурос, сам — в море прямо над Ахеей на карте. Авгий Всевидящий: улику дают за Нестора, сам — в Пеллене, на Берегу мусорщиков (Scavenger's Coast).",spoiler:false,labels:["Не подтверждено"],src:["psn104"]},{text:"Мегакреон Нерушимый убивается в сюжетном задании «Театр и шпионаж» (Theatrics and Espionage), Фила Буря — в «Пасти Левиафана», где вы получаете «Правосудие льва» для трофея «Больше жизни».",spoiler:false,labels:["Не подтверждено"],src:["psn104"]},{text:"Без этих Древних не получить и трофей «Создатель царей» — убейте всех.",spoiler:false,labels:["Не подтверждено"],src:["psn105"]}]},{num:75,en:"Seeing Red",ru:"Красная пелена",ruOfficial:true,desc:"Убейте 10 врагов при помощи ярости рода.",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Legacy of the First Blade: Episode 3",rarity:"6.0%",rarityLabel:"Very Rare",stage:"s11",missable:false,online:false,buggy:false,grind:false,tips:[{text:"«Ярость рода» (Fury of the Bloodline) — умение ветки Воина; полностью прокачивать его не обязательно. Снизьте врагу здоровье основным оружием и добейте умением.",spoiler:false,labels:["Подтверждено"],src:["psn105","st312"]},{text:"Для удобства сбросьте ум

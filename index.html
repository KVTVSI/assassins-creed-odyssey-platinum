ения и вложитесь в урон Воина, наденьте снаряжение с бонусом к урону Воина.",spoiler:false,labels:["Не подтверждено"],src:["st312"]},{text:"Убийства животных (волков, медведей, рысей) тоже засчитываются.",spoiler:false,labels:["Не подтверждено"],src:["psn105"]}]},{num:76,en:"Bittersweet Beginnings",ru:"Радость и печаль",ruOfficial:true,desc:"Защитите свой род",descOfficial:true,type:"bronze",hidden:true,dlc:true,group:"Legacy of the First Blade: Episode 3",rarity:"6.7%",rarityLabel:"Very Rare",stage:"s11",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Сюжетный и неупускаемый: выпадает за последнее основное задание третьего эпизода «Наследие первого клинка».",spoiler:false,labels:["Не подтверждено"],src:["psn105"]}]},{num:77,en:"Surgical Sniper",ru:"Меткий лекарь",ruOfficial:true,desc:"Восстановите запас здоровья, совершив 10 убийств выстрелом в голову из лука \"Золотой вестник\".",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Legacy of the First Blade: Episode 3",rarity:"1.6%",rarityLabel:"Ultra Rare",stage:"s11",missable:false,online:false,buggy:false,grind:false,tips:[{text:"По Stratege.ru, «Золотой предвестник» на самом деле посох (булава): экипируйте его основным оружием, а убивайте выстрелом в голову из любого лука; гравировка на луке не нужна.",spoiler:false,labels:["Не подтверждено"],src:["st314"]},{text:"По PSNProfiles, это лук: наденьте его в один из слотов и добивайте выстрелом в голову именно им, ослабив цель основным оружием или бронёй с уроном Охотника.",spoiler:false,labels:["Не подтверждено"],src:["psn105"]},{text:"Оружие выпадает с Гергиса Глашатая, которого убивают по сюжету третьего эпизода.",spoiler:false,labels:["Не подтверждено"],src:["psn105"]},{text:"Враг не обязан быть раненым, подходят и мирные жители: проще всего застрелить в голову 10 горожан в любом городе.",spoiler:false,labels:["Подтверждено"],src:["psn105","st314"]},{text:"Похоже, считаются именно попадания в голову: у одного игрока трофей выпал после 6 убийств, где он несколько раз попадал в голову дважды.",spoiler:false,labels:["Не подтверждено"],src:["st314"]}]},{num:78,en:"Kingmaker",ru:"Создатель царей",ruOfficial:true,desc:"Найдите меч царей",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Legacy of the First Blade: Episode 3",rarity:"6.0%",rarityLabel:"Very Rare",stage:"s11",missable:false,online:false,buggy:false,grind:true,tips:[{text:"После сюжета третьего эпизода вы получите сломанный Меч царей и задание «Наследие древних»: кузнец в Фокиде у Ойкоса олимпийцев (рядом с торговцем орихалком) починит его адамантом. Меч нужно не найти, а выковать.",spoiler:false,labels:["Подтверждено"],src:["psn105","st315"]},{text:"Адамант выпадает в виде ожерелий с каждого Древнего, поэтому нужно убить всех членов Ордена из всех трёх эпизодов (трофеи «Хищник и добыча», «Укротитель бури», «За Персию») и вернуться к кузнецу.",spoiler:false,labels:["Подтверждено"],src:["psn105","st315"]}]},{num:79,en:"For Love of Persia",ru:"За Персию",ruOfficial:true,desc:"Убейте всех Древних из Ордена Власти в Месинии",descOfficial:true,type:"gold",hidden:false,dlc:true,group:"Legacy of the First Blade: Episode 3",rarity:"6.1%",rarityLabel:"Very Rare",stage:"s11",missable:false,online:false,buggy:false,grind:true,tips:[{text:"Нужно убить семь Древних Ордена Власти в Месинии; Бессмертных вы убьёте по сюжету (задание «Простая жизнь» (The Simple Life)), остальных находят по уликам.",spoiler:false,labels:["Не подтверждено"],src:["psn105"]},{text:"После всех основных и побочных заданий останутся трое неизвестных. Улики: в конце лагеря «Пропасть Кеада» (в яме), в лагере Педаса под одним из навесов и на трупе солдата в болотах чуть выше залива Аида.",spoiler:false,labels:["Подтверждено"],src:["psn105","st316"]},{text:"Артазострея Тишина бродит по Месинии, Питий Архитектор находится в Айпее, Гаспар Привратник — в Ущелье ужаса (Terror Gorge).",spoiler:false,labels:["Не подтверждено"],src:["psn105"]},{text:"Димократ Разрушитель, Гергис Глашатай и Аморг, Бивень Персии, убиваются по сюжету — в заданиях «Устройство космоса» (The Ordering of the Kosmos), «Последний маг» (The Last Magi) или «Дым и ярость» (Smoke and Fury) и «Наследие первого клинка».",spoiler:false,labels:["Не подтверждено"],src:["psn105"]},{text:"Пропущенный Древний закроет и трофей «Создатель царей» — добейте всех.",spoiler:false,labels:["Подтверждено"],src:["psn105","st315"]}]},{num:80,en:"No More Rulers",ru:"Долой царей",ruOfficial:true,desc:"Убейте всех Смотрителей в Элизии.",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"The Fate of Atlantis: Episode 1",rarity:"7.4%",rarityLabel:"Very Rare",stage:"s12",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужно убить троих Смотрителей Элизия. На карте видны четыре, но Персефону в Асфоделевых лугах трогать не нужно; осмотрите отмеченные серым цели Икаром, чтобы узнать имена.",spoiler:false,labels:["Подтверждено"],src:["psn106","st317"]},{text:"Эгея, царица амазонок — «Наследие Девкалиона», Крепость трёх сестёр (Fortress of the Three Sisters); Аталанта Охотница — «Вера Миноса», Мавзолей царицы без царства (Mausoleum of the Kingless Queen); Ифигения Принесённая в жертву — «Приют Ферайи», подворье Ифигении (Iphigenia's Compound).",spoiler:false,labels:["Не подтверждено"],src:["psn106"]},{text:"Каждый Смотритель сидит в хорошо охраняемом форте, как полемарх в основной игре: сначала зачистите охрану; можно оглушить их факелами Гипноса и добить скрытно.",spoiler:false,labels:["Не подтверждено"],src:["psn106"]}]},{num:81,en:"In the Face of the Gods",ru:"В лицо богам",ruOfficial:true,desc:"Вспомните, кто вы.",descOfficial:true,type:"bronze",hidden:true,dlc:true,group:"The Fate of Atlantis: Episode 1",rarity:"7.3%",rarityLabel:"Very Rare",stage:"s12",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Сюжетный и неупускаемый: выдаётся за задание Адониса «Мёртвые цари и красивые вещи» (Dead Kings and Pretty Things), связанное с поиском спартанца.",spoiler:false,labels:["Подтверждено"],src:["psn106","st318"]}]},{num:82,en:"Blasphemer",ru:"Богоборчество",ruOfficial:true,desc:"Уничтожьте все дары Мраморной Деве.",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"The Fate of Atlantis: Episode 1",rarity:"4.3%",rarityLabel:"Ultra Rare",stage:"s12",missable:false,online:false,buggy:false,grind:true,tips:[{text:"Всего 18 даров Мраморной Деве (статуй) в четырёх областях Элизия: «Наследие Девкалиона» — 3, «Вера Миноса» — 6, «Приют Ферайи» — 6, «Асфоделевые луга» — 3.",spoiler:false,labels:["Подтверждено"],src:["psn106","st319"]},{text:"До обнаружения статуи отмечены на карте знаком вопроса. Их охраняют, но разрушаются они как обычные враги — просто бейте; за каждую дают очко умений.",spoiler:false,labels:["Не подтверждено"],src:["psn106"]}]},{num:83,en:"Gathering Strength",ru:"Набирая силу",ruOfficial:true,desc:"Соберите все Откровения Хранителя в эпизоде 1.",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"The Fate of Atlantis: Episode 1",rarity:"7.4%",rarityLabel:"Very Rare",stage:"s12",missable:false,online:false,buggy:false,grind:false,tips:[{text:"После разговора с Гермесом появится основное задание «Растущее восприятие» (A Growing Perception): найдите 4 Откровения Хранителя в местах со значком треугольника. Откровения улучшают полностью прокачанные умения.",spoiler:false,labels:["Не подтверждено"],src:["psn106"]},{text:"Места (названия в переводе): Тайный алтарь Гермеса (Veiled Altar of Hermes) во «Вере Миноса» — Бычий натиск Ареса; Приют павших героев (Dead Heroes Haven) и Затонувшая пасть Стикса (Sunken Jaw of the Styx) в «Приюте Ферайи» — Искажение времени Кроноса и Мощь Артемиды; Пещера погребённой тишины (Buried Silence Cave) в «Асфоделевых лугах» — Безумие Ареса.",spoiler:false,labels:["Не подтверждено"],src:["psn106"]}]},{num:84,en:"The Conqueror",ru:"Завоевание",ruOfficial:true,desc:"Завоюйте Элизий с помощью освобожденных людей из трех основных областей.",descOfficial:true,type:"silver",hidden:false,dlc:true,group:"The Fate of Atlantis: Episode 1",rarity:"5.2%",rarityLabel:"Very Rare",stage:"s12",missable:false,online:false,buggy:false,grind:true,tips:[{text:"Нужно побочное задание Адониса «Освободи их разум, остальное приложится»: оно открывается после «Мёртвых царей и красивых вещей», где учат освобождать солдат. Оглушите, не убивая, и освободите по 8 бойцов Персефоны в каждой из трёх областей («Наследие Девкалиона», «Вера Миноса», «Приют Ферайи»); трофей выпадает после финального задания эпизода.",spoiler:false,labels:["Подтверждено"],src:["psn106","st321","st404"]},{text:"Трофей не упускается: задание можно выполнить когда угодно, даже после третьего эпизода, вернувшись в Элизий; по более свежим отзывам трофей выпадает, даже если задание раньше не брали.",spoiler:false,labels:["Подтверждено"],src:["psn106","psn206","st321","st404"]},{text:"Автор одной темы на форуме Stratege.ru считал трофей упускаемым, если сразу пойти на финальное задание эпизода; другие игроки это опровергли. Для спокойствия сделайте ручное сохранение перед финалом.",spoiler:false,labels:["Не подтверждено","Устарело?"],src:["st404"]},{text:"Удобнее всего оглушать стрелами: в наборе Охотника с оглушающими стрелами и «Призрачными стрелами Артемиды» слабым хватает одной стрелы в голову, сильным двух. Пинок или атака со спины медленнее, и врага легко случайно убить.",spoiler:false,labels:["Подтверждено"],src:["psn106","st321","st404"]},{text:"Сначала возьмите задание, а потом зачищайте крепости: игроку, вычистившему их заранее, не хватило бойцов для освобождения.",spoiler:false,labels:["Не подтверждено"],src:["st321"]}]},{num:85,en:"Bad Dog!",ru:"Плохой пес!",ruOfficial:true,desc:"Победите Цербера.",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"The Fate of Atlantis: Episode 2",rarity:"6.6%",rarityLabel:"Very Rare",stage:"s12",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Бой с Цербером идёт по сюжету в начале второго эпизода, в яме, куда вы падаете; пропустить его нельзя.",spoiler:false,labels:["Не подтверждено"],src:["psn107"]},{text:"Тактика: уклоняйтесь от огненных шаров из голов, держите дистанцию при его прыжке и перекатывайтесь вбок или назад; можно стрелять из лука издалека или бить вблизи сверхмощными атаками.",spoiler:false,labels:["Не подтверждено"],src:["psn107"]}]},{num:86,en:"Guardian of the Underworld",ru:"Страж царства мертвых",ruOfficial:true,desc:"Закройте все разломы Тартара.",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"The Fate of Atlantis: Episode 2",rarity:"3.3%",rarityLabel:"Ultra Rare",stage:"s12",missable:false,online:false,buggy:false,grind:true,tips:[{text:"Разломы Тартара разбросаны по Аиду: активируйте разлом, победите несколько врагов, и он закроется. Внутри ваше здоровье делится пополам, а до активации врагам нельзя нанести урон.",spoiler:false,labels:["Не подтверждено"],src:["psn107"]},{text:"Часть разломов спрятана за завесами Тартара: туда пускают только в собранном комплекте «Доспех павших» (см. трофей «Сильнее всех»).",spoiler:false,labels:["Подтверждено"],src:["psn107","st324"]},{text:"Первый разлом закрывается в сюжетном задании «Страж врат» (Guardian of the Gates); остальные ищите в неисследованных местах со знаком вопроса.",spoiler:false,labels:["Не подтверждено"],src:["psn107"]},{text:"Места разломов (названия в переводе): по одному — Выжженные земли (Scorched Lands), Бездна мучений (Chasm of Torment), Поля скорби (Mourning Fields), Пещера отчаяния (Cave of Despair); по два — Затерянный храм Никты (Lost Temple of Nyx), Гордыня Салмонея (Salmoneus's Hubris), Древний теменос (Ancient Temenos), Бесплодный пруд (Barren Pond), Отголоски Стикса (Echoes of the Styx), Яма лишений (Pit of Deprivation), Беспокойный некрополь (Restless Nekropolis), Колыбель подземного мира (Cradle of the Underworld).",spoiler:false,labels:["Не подтверждено"],src:["psn107"]},{text:"Трофей не упускается: если не хватает одного разлома, ещё раз обойдите все локации — один игрок так нашёл пропущенный.",spoiler:false,labels:["Не подтверждено"],src:["psn207"]}]},{num:87,en:"The One",ru:"Сильнее всех",ruOfficial:true,desc:"Победите всех павших.",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"The Fate of Atlantis: Episode 2",rarity:"5.2%",rarityLabel:"Very Rare",stage:"s12",missable:false,online:false,buggy:false,grind:true,tips:[{text:"Сюжетное задание «Павшие стражи подземного мира» (The Underworld's Fallen Guardians) заменяет вкладку наёмников вкладкой «Павшие»: победа над одним открывает следующего, поэтому охотьтесь снизу вверх. На вершине — четыре героя-стража: Ахиллес, Персей, Агамемнон и Геракл.",spoiler:false,labels:["Не подтверждено"],src:["psn107"]},{text:"Большинство Павших отмечены на карте вопросами, но стражи прячутся за завесами Тартара — туда попадают только в собранном комплекте «Доспех павших».",spoiler:false,labels:["Подтверждено"],src:["psn107","st324"]},{text:"Не все Павшие доступны сразу: Тестикл Олимпиец появится в задании «Проклятая болезнь» только после задания Харона «Лучше смерть, чем бесчестье»; ещё один Павший связан с другими заданиями Харона, последний культист — с побочной цепочкой.",spoiler:false,labels:["Подтверждено"],src:["psn107","st324"]},{text:"Список: силовики — Отравитель Афин (Поля скорби, к северу от Колыбели подземного мира), Тестикл Олимпиец (Выжженные земли), Циклоп с Кефалинии (вне карты, цепочка «Потерян, но не забыт» (Lost, but Not Forgotten)); культисты — Рыба-меч, Эпиктет, Деянира, Торгаш из Коринфии (задание «Змей сбрасывает кожу» (The Snake Sheds His Skin)); стражи — Персей (Выжженные земли, к востоку от Древнего теменоса), Ахиллес (Поля скорби, Зал маний), Агамемнон (Яма лишений), Геракл (Тартар).",spoiler:false,labels:["Не подтверждено"],src:["psn107"]},{text:"Части «Доспеха павших»: шлем — Отравитель Афин, нагрудник — Рыба-меч (Сгоревший храм Мойры), перчатки — задания во дворце Аида «Новая аренда смерти» (A New Lease on Death) и «Оружие искупления» (Arms of Atonement), пояс — Эпиктет (Логово Орфея), сапоги — Деянира (Алтари титанов). Полный комплект открывает гравировку: нанесите её на любую часть своей брони, и в завесы можно ходить в своём снаряжении.",spoiler:false,labels:["Не подтверждено"],src:["psn107","psn207"]}]},{num:88,en:"Gathering More Strength",ru:"Накопление силы",ruOfficial:true,desc:"Соберите все Откровения Хранителя в эпизоде 2.",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"The Fate of Atlantis: Episode 2",rarity:"6.2%",rarityLabel:"Very Rare",stage:"s12",missable:false,online:false,buggy:false,grind:false,tips:[{text:"После разговора с Аидом появится задание «Следующий урок» (The Next Lesson): найдите 3 Откровения Хранителя, отмеченных на карте белыми треугольниками.",spoiler:false,labels:["Подтверждено"],src:["psn107","st325"]},{text:"Откровение в «Зале маний» (внизу справа на карте) доступно только в собранном комплекте «Доспех павших».",spoiler:false,labels:["Подтверждено"],src:["psn107","st325"]},{text:"В «Пещеру, где родился Кронос» попадают через «Сокровищницу Кроноса»: почти у входа в полу есть дыра — прыгайте в неё.",spoiler:false,labels:["Не подтверждено"],src:["st325"]},{text:"Места и награды (в переводе): Логово суда (Den of Judgement) в Бездне мучений — Хитрость Артемиды; Пещера рождения Кроноса в Выжженных землях — Сдвиг времени Кроноса; Зал маний на Полях скорби — Последний вздох Ареса.",spoiler:false,labels:["Не подтверждено"],src:["psn107"]}]},{num:89,en:"A True Ruler",ru:"Истинная власть",ruOfficial:true,desc:"Свергните царя.",descOfficial:true,type:"silver",hidden:true,dlc:true,group:"The Fate of Atlantis: Episode 2",rarity:"6.1%",rarityLabel:"Very Rare",stage:"s12",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Сюжетный и неупускаемый: выпадает за основное задание «Труды Хранителя» (Labors of the Keeper) — финал второго эпизода.",spoiler:false,labels:["Не подтверждено"],src:["psn107"]},{text:"Финальный босс эпизода уязвим к огню: огненные стрелы с уроном со временем особенно полезны, когда он ставит щит. Сбивайте из лука парящие сферы, уходите с красных кругов и из золотого круга (он блокирует адреналин и умения); сверхмощные атаки оглушают и прерывают его.",spoiler:false,labels:["Не подтверждено"],src:["psn107"]}]},{num:90,en:"Your Own Medicine",ru:"Той же монетой",ruOfficial:true,desc:"Убейте 10 воинов ису, используя усиление \"Благословение Кроноса\".",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"The Fate of Atlantis: Episode 3",rarity:"1.6%",rarityLabel:"Ultra Rare",stage:"s12",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Сначала получите Откровение Хранителя «Благословение Кроноса» (см. «Набираясь сил») и улучшите им полностью прокачанное умение «Ядовитые атаки» ветки Убийцы, поставьте его на кнопку. Нужно убить 10 воинов ису под действием усиления.",spoiler:false,labels:["Подтверждено"],src:["psn108","st327"]},{text:"Простой способ: посох Дикаста оглушает, а не убивает. В укреплённом месте с толпой стражников вырубите их, затем смените оружие, включите благословение и добивайте; можно заранее снизить сложность и автоподстройку уровня.",spoiler:false,labels:["Подтверждено"],src:["psn108","st327"]},{text:"По Stratege.ru, усиление действует 20 секунд — заранее раньте врагов, чтобы добивать их одним ударом.",spoiler:false,labels:["Не подтверждено"],src:["st327"]},{text:"По PSNProfiles, усиление действует 15 секунд, даёт +50% адреналина от урона и отключает убывание адреналина и эффекты заморозки.",spoiler:false,labels:["Не подтверждено"],src:["psn108"]}]},{num:91,en:"Isu Bloodline",ru:"Кровь ису",ruOfficial:true,desc:"Достигните новой ступени знания",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"The Fate of Atlantis: Episode 3",rarity:"5.3%",rarityLabel:"Very Rare",stage:"s12",missable:false,online:false,buggy:false,grind:true,tips:[{text:"Нужно достичь 3-го, максимального уровня знаний ису (задание «Последовательность знаний» (Knowledge Sequence)). Знания дают Откровения Хранителя (+30), хранилища данных ису (+10) и кодексы ису (+3).",spoiler:false,labels:["Подтверждено"],src:["psn108","st328"]},{text:"Хранилищ данных ису 17, они в архивах, домах и святилищах по всей Атлантиде (на карте — знаки вопроса). Их сбор полностью заполняет шкалу и открывает места, закрытые до этого.",spoiler:false,labels:["Подтверждено"],src:["psn108","st328"]},{text:"Хранилища (названия в переводе): Укреплённый дом Автохтона (Fortified Doma of Autochthonos), Архив Конса (The Consus Archive), Прозрение титана (Insight of the Titan), Дом Азаэса (Doma of Azaes), Хранилище Исиды (Repository of Isis), Архив Гебы (Archive of Hebe), Дом Гадира (Doma of Gadiros), Укреплённый дом Местора (Fortified Doma of Mestor), Прозрение войны (Insight of War), Дом Диапрепа (Doma of Diaprepes), Архив Гефеста (Archive of Hephaistos), Дом Эвемона (Doma of Evaimon), Прозрение благословений (Insight of Blessings), Дом Эласиппа (Doma of Elasippos), Хранилище Гора (Horus Repository), Архив Тинии (The Tinia Archive), Укреплённый дом Мнесея (Fortified Doma of Mneseas).",spoiler:false,labels:["Не подтверждено"],src:["psn108"]}]},{num:92,en:"Hephaistos's Apprentice",ru:"Подмастерье Гефеста",ruOfficial:true,desc:"Изготовьте 3 вида легендарного оружия.",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"The Fate of Atlantis: Episode 3",rarity:"4.3%",rarityLabel:"Ultra Rare",stage:"s12",missable:false,online:false,buggy:false,grind:true,tips:[{text:"Нужно выковать 3 легендарных оружия из адаманта: по 3 слитка на каждое, всего 9. Три слитка дают по сюжету, остальные лежат в хорошо охраняемых хранилищах (на карте — треугольники и вопросы).",spoiler:false,labels:["Подтверждено"],src:["psn108","st329"]},{text:"Слитки по PSNProfiles (в переводе): Хранилище Исиды (Repository of Isis), Архив Конса (The Consus Archive), Прозрение титана (Insight of the Titan), Архив Гебы (Archive of Hebe), Прозрение войны (Insight of War), Архив Гефеста (Archive of Hephaistos), Архив Тинии (The Tinia Archive), Хранилище Гора (Horus Repository), Прозрение благословений (Insight of Blessings).",spoiler:false,labels:["Не подтверждено"],src:["psn108"]},{text:"Можно сковать копьё, булаву и клинок, каждый раз выбирая бонус Охотника, Воина или Убийцы, — у каждого своя новая гравировка: копьё переводит 50% бонусов ветки во весь урон, булава распространяет урон на ближайших врагов, клинок снижает все перезарядки на 10% при убийстве умением.",spoiler:false,labels:["Не подтверждено"],src:["psn108"]},{text:"Если убить финального босса третьего эпизода, не выковав три оружия, игра вернёт вас в Грецию. Вернуться можно через карту мира: в углу откройте раздел «Другие миры» и выберите мир дополнения.",spoiler:false,labels:["Не подтверждено"],src:["st404"]}]},{num:93,en:"Gathering Full Strength",ru:"Набираясь сил",ruOfficial:true,desc:"Соберите все Откровения Хранителя в эпизоде 3.",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"The Fate of Atlantis: Episode 3",rarity:"5.3%",rarityLabel:"Very Rare",stage:"s12",missable:false,online:false,buggy:false,grind:false,tips:[{text:"После разговора с Посейдоном появится задание «Полное образование» (A Complete Education): найдите 3 Откровения Хранителя (значок треугольника) у краёв карты — два внизу слева и справа, одно наверху.",spoiler:false,labels:["Подтверждено"],src:["psn108","st330"]},{text:"По Stratege.ru, для входа в места с откровениями хватает 1-го уровня знаний ису.",spoiler:false,labels:["Не подтверждено"],src:["st330"]},{text:"По PSNProfiles, чтобы получить все откровения, нужно заполнить шкалу знаний (см. трофей «Кровь ису»).",spoiler:false,labels:["Не подтверждено"],src:["psn108"]},{text:"Что дают: Прозрение благословений (справа) — Благословение Кроноса вместо ядовитых атак, нужно для «Той же монетой»; Прозрение титана (сверху) — Кара Кроноса, дальняя атака из скрытности вместо призыва к оружию; Прозрение войны (слева) — Гнев Ареса, замедление и взрыв по области вместо кольца хаоса.",spoiler:false,labels:["Подтверж <script id="core">
/*
  Ядро гайда: window.App. Без оформления и без рендера экранов.
  Экраны рисует блок ui через хуки:
    App.renderAll()              — один раз при App.start() (шапка, все панели);
    App.onRoute(tab)             — при каждом переключении вкладки (до восстановления прокрутки);
    App.renderSheet(num, body, sheet) — содержимое шторки трофея;
    App.on('change', cb)         — перерисовка после progress.json, отметок, импорта, сброса,
                                   спойлеров, закрепления этапа; cb({reason}).
  Поля трофея читаются как t.en / t.ru (без литералов с двоеточием — их считает check_site.py).
*/
(function () {
  'use strict';

  var SLUG = 'assassins-creed-odyssey';
  var PREFIX = 'plat-guide:assassins-creed-odyssey:v1:';
  var TABS = ['now', 'plan', 'trophies', 'extras', 'info'];
  var TYPES = ['platinum', 'gold', 'silver', 'bronze'];
  var D = (typeof DATA !== 'undefined' && DATA) ? DATA : {};
  D.meta = D.meta || {};
  D.sources = D.sources || {};
  D.stages = D.stages || [];
  D.trophies = D.trophies || [];

  var App = window.App || {};
  window.App = App;
  App.DATA = D;
  App.SLUG = SLUG;
  App.TABS = TABS.slice();
  App.TYPES = TYPES.slice();
  App.labels = {
    types: { platinum: 'Платиновый', gold: 'Золотой', silver: 'Серебряный', bronze: 'Бронзовый' },
    kinds: {
      missable: 'Можно пропустить', nonreturn: 'Точка невозврата', online: 'Онлайн', bug: 'Баг',
      time: 'Время', patch: 'Патч', dlc: 'Дополнение', other: 'Важно'
    },
    tabs: { now: 'Сейчас', plan: 'План', trophies: 'Трофеи', extras: 'Сбор', info: 'Инфо' }
  };
  App.config = { sheetCloseMs: 250, swipeCloseDistance: 90 };

  /* ---------- утилиты ---------- */

  // Та же нормализация, что norm() в sync/make_progress.py.
  function norm(s) {
    s = String(s == null ? '' : s).toLowerCase();
    s = s.replace(/[‘’‛`´]/g, "'");
    s = s.replace(/[‐-―−]/g, '-');
    s = s.replace(/[​-‍﻿]/g, '');
    return s.split(/\s+/).filter(Boolean).join(' ');
  }
  App.norm = norm;

  // Для поиска: norm + ё→е.
  function normSearch(s) { return norm(s).replace(/ё/g, 'е'); }
  App.normSearch = normSearch;

  App.esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtDate(d) { return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear(); }
  App.fmtDate = fmtDate;

  var MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };

  // "31st Jul 2026" (как на PSNProfiles, возможно со временем на следующей строке) -> "31.07.2026".
  // Если не разобралась — исходная строка (пустая строка для пустого значения).
  function parsePsnDate(s) {
    var raw = String(s == null ? '' : s).trim();
    var m = /(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]{3,})\.?,?\s+(\d{4})/.exec(raw);
    if (m) {
      var day = +m[1], mon = MONTHS[m[2].slice(0, 3).toLowerCase()], year = +m[3];
      if (mon && day >= 1 && day <= 31) return pad2(day) + '.' + pad2(mon) + '.' + year;
    }
    return raw.split(/\n/)[0].trim();
  }
  App.parsePsnDate = parsePsnDate;

  function psnDateValue(s) {
    var m = /(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]{3,})\.?,?\s+(\d{4})/.exec(String(s || ''));
    if (!m) return 0;
    var mon = MONTHS[m[2].slice(0, 3).toLowerCase()];
    if (!mon) return 0;
    var t = new Date(+m[3], mon - 1, +m[1]).getTime();
    var tm = /(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i.exec(String(s));
    if (tm) {
      var h = +tm[1] % 12;
      if (tm[4] && tm[4].toUpperCase() === 'PM') h += 12;
      if (!tm[4]) h = +tm[1];
      t += ((h * 60 + +tm[2]) * 60 + +(tm[3] || 0)) * 1000;
    }
    return t;
  }

  /* ---------- хранилище ---------- */

  var store = {
    key: function (k) { return PREFIX + k; },
    get: function (k, def) {
      try {
        var v = window.localStorage.getItem(PREFIX + k);
        if (v === null || v === undefined) return def;
        return JSON.parse(v);
      } catch (e) { return def; }
    },
    set: function (k, v) {
      try { window.localStorage.setItem(PREFIX + k, JSON.stringify(v)); return true; } catch (e) { return false; }
    },
    remove: function (k) {
      try { window.localStorage.removeItem(PREFIX + k); return true; } catch (e) { return false; }
    }
  };
  App.store = store;

  /* ---------- события ---------- */

  var listeners = {};
  App.on = function (ev, cb) { (listeners[ev] = listeners[ev] || []).push(cb); return App; };
  App.off = function (ev, cb) {
    var l = listeners[ev] || [];
    var i = l.indexOf(cb);
    if (i >= 0) l.splice(i, 1);
    return App;
  };
  function emit(ev, detail) {
    (listeners[ev] || []).slice().forEach(function (cb) {
      try { cb(detail || {}); } catch (e) { if (window.console) console.error(e); }
    });
  }
  App.emit = emit;
  function changed(reason) { emit('change', { reason: reason }); }

  /* ---------- индексы данных ---------- */

  var byNum = {}, byNorm = {}, stageById = {}, stageOfNum = {};
  D.trophies.forEach(function (t) { byNum[t.num] = t; byNorm[norm(t.en)] = t; });
  D.stages.forEach(function (s) {
    stageById[s.id] = s;
    (s.trophies || []).forEach(function (n) { stageOfNum[n] = s.id; });
  });

  App.trophies = function () { return D.trophies; };
  App.stages = function () { return D.stages; };
  App.trophy = function (num) { return byNum[num] || null; };
  App.trophyByName = function (name) { return byNorm[norm(name)] || null; };
  App.stage = function (id) { return stageById[id] || null; };
  App.stageOf = function (num) {
    var t = byNum[num];
    return stageById[(t && t.stage) || stageOfNum[num]] || null;
  };
  App.stageTrophies = function (id) {
    var s = stageById[id];
    return s ? (s.trophies || []).map(function (n) { return byNum[n]; }).filter(Boolean) : [];
  };
  App.source = function (id) { return D.sources[id] || null; };
  App.hasPlatinum = D.meta.hasPlatinum !== false;
  App.hasCollectibles = function () { return !!(D.meta.collectibles && D.meta.collectibles.length); };

  /* ---------- слой PSN ---------- */

  var psnByNum = {};         // num -> {date, dateText, time}
  var earnedNames = [];      // норм. названия из progress.json (все, включая несопоставленные)
  var earnedRaw = [];        // те же названия как в progress.json (для ключа seen)
  var progressSig = null;
  var progressInflight = null;
  App.progressState = 'idle'; // idle | loading | ok | error
  App.progressUpdated = null; // поле updated из progress.json (ISO-строка)
  App.progressUnmatched = []; // названия из progress.json, которых нет в DATA

  function applyProgress(data) {
    var list = (data && Array.isArray(data.earned)) ? data.earned : [];
    var map = {}, names = [], raw = [], unmatched = [];
    list.forEach(function (e) {
      var name = (e && typeof e === 'object') ? e.name : e;
      if (!name) return;
      var k = norm(name);
      names.push(k);
      raw.push(String(name));
      var t = byNorm[k];
      if (!t) { unmatched.push(String(name)); return; }
      var ds = (e && typeof e === 'object' && e.date) ? String(e.date) : '';
      map[t.num] = { date: ds, dateText: ds ? parsePsnDate(ds) : '', time: psnDateValue(ds) };
    });
    psnByNum = map;
    earnedNames = names;
    earnedRaw = raw;
    App.progressUpdated = (data && data.updated) ? String(data.updated) : null;
    App.progressUnmatched = unmatched;
    App.progressState = 'ok';
    setupSeenBaseline();
  }

  function loadProgress() {
    if (progressInflight) return progressInflight;
    if (App.progressState !== 'ok') App.progressState = 'loading';
    progressInflight = fetch('progress.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (text) {
        var data = JSON.parse(text.replace(/^﻿/, ''));
        var sig = JSON.stringify([data && data.updated, data && data.earned]);
        var first = App.progressState !== 'ok';
        if (sig !== progressSig || first) {
          progressSig = sig;
          applyProgress(data);
          changed('progress');
        }
        return true;
      })
      .catch(function () {
        // Молча работаем по ручному слою (и по прошлой удачной загрузке, если была).
        if (App.progressState !== 'ok') { App.progressState = 'error'; changed('progress'); }
        return false;
      })
      .then(function (ok) { progressInflight = null; return ok; });
    return progressInflight;
  }
  App.loadProgress = loadProgress;

  App.psn = function (num) { return psnByNum[num] || null; };

  // Дата сверки с PSN: "дд.мм.гггг, чч:мм" (или исходная строка, или '').
  App.progressUpdatedText = function () {
    var u = App.progressUpdated;
    if (!u) return '';
    var d = new Date(u);
    if (isNaN(d.getTime())) return u;
    return fmtDate(d) + ', ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  };

  /* ---------- ручной слой ---------- */

  var manual = {}; // num -> true

  function loadManual() {
    manual = {};
    var arr = store.get('manual', []);
    if (!Array.isArray(arr)) arr = [];
    arr.forEach(function (name) { var t = byNorm[norm(name)]; if (t) manual[t.num] = true; });
  }
  function manualNames() {
    return D.trophies.filter(function (t) { return manual[t.num]; }).map(function (t) { return t.en; });
  }
  function saveManual() { store.set('manual', manualNames()); }

  App.isPsn = function (num) { return !!psnByNum[num]; };
  App.isManual = function (num) { return !!manual[num] && !psnByNum[num]; };
  App.isDone = function (num) { return !!psnByNum[num] || !!manual[num]; };
  App.status = function (num) { return psnByNum[num] ? 'psn' : (manual[num] ? 'manual' : 'todo'); };

  // false, если трофей подтверждён PSN (ручная отметка не ставится) или не найден.
  App.setManual = function (num, on) {
    if (!byNum[num]) return false;
    if (on && psnByNum[num]) return false;
    var was = !!manual[num];
    if (on) manual[num] = true; else delete manual[num];
    if (was !== !!on) { saveManual(); changed('manual'); }
    return true;
  };
  App.toggleManual = function (num) { return App.setManual(num, !manual[num]); };

  /* ---------- подсчёты ---------- */

  function emptyCnt() { return { done: 0, total: 0 }; }
  function inc(c, done) { c.total++; if (done) c.done++; }

  App.counts = function () {
    var r = {
      base: emptyCnt(), dlc: emptyCnt(), all: emptyCnt(),
      byType: {}, dlcByType: {}, byStage: {}, goal: null
    };
    TYPES.forEach(function (ty) { r.byType[ty] = emptyCnt(); r.dlcByType[ty] = emptyCnt(); });
    D.trophies.forEach(function (t) {
      var done = App.isDone(t.num);
      inc(r.all, done);
      inc(t.dlc ? r.dlc : r.base, done);
      var bucket = t.dlc ? r.dlcByType : r.byType;
      if (!bucket[t.type]) bucket[t.type] = emptyCnt();
      inc(bucket[t.type], done);
    });
    D.stages.forEach(function (s) {
      var c = emptyCnt();
      (s.trophies || []).forEach(function (n) { if (byNum[n]) inc(c, App.isDone(n)); });
      r.byStage[s.id] = c;
    });
    var g = App.hasPlatinum ? r.base : r.all;
    r.goal = { done: g.done, total: g.total, pct: g.total ? Math.round(g.done * 100 / g.total) : 0 };
    return r;
  };

  App.stageProgress = function (id) {
    var c = emptyCnt();
    var s = stageById[id];
    if (s) (s.trophies || []).forEach(function (n) { if (byNum[n]) inc(c, App.isDone(n)); });
    return c;
  };

  function platinumTrophy() {
    for (var i = 0; i < D.trophies.length; i++) if (D.trophies[i].type === 'platinum') return D.trophies[i];
    return null;
  }
  App.platinumTrophy = platinumTrophy;
  App.platinumEarned = function () { var p = platinumTrophy(); return !!(p && App.isDone(p.num)); };

  /* ---------- текущий этап ---------- */

  function baseClosed() {
    var any = false;
    for (var i = 0; i < D.stages.length; i++) {
      var s = D.stages[i];
      if (s.dlc) continue;
      var c = App.stageProgress(s.id);
      if (!c.total) continue;
      any = true;
      if (c.done < c.total) return false;
    }
    return any;
  }

  // {stage, id, pinned, done}: done = платина получена или все этапы основной игры закрыты.
  // Без закрепления при done stage = null (UI показывает «Платина получена»).
  App.currentStage = function () {
    var done = D.trophies.length > 0 && (App.platinumEarned() || baseClosed());
    var pin = store.get('pinnedStage', null);
    if (pin && stageById[pin]) return { stage: stageById[pin], id: pin, pinned: true, done: done };
    if (!D.stages.length) return { stage: null, id: null, pinned: false, done: done };
    if (!D.trophies.length) return { stage: D.stages[0], id: D.stages[0].id, pinned: false, done: false };
    if (done) return { stage: null, id: null, pinned: false, done: true };
    for (var i = 0; i < D.stages.length; i++) {
      var s = D.stages[i];
      if (s.dlc) continue;
      var c = App.stageProgress(s.id);
      if (c.done < c.total) return { stage: s, id: s.id, pinned: false, done: false };
    }
    return { stage: D.stages[0], id: D.stages[0].id, pinned: false, done: false };
  };
  App.pinnedStage = function () { var p = store.get('pinnedStage', null); return stageById[p] ? p : null; };
  App.pinStage = function (id) {
    if (!stageById[id]) return false;
    store.set('pinnedStage', id); changed('pin'); return true;
  };
  App.unpinStage = function () { store.remove('pinnedStage'); changed('pin'); };

    if (!String(text || '').trim()) { pendingImport = null; showImport('<div class="msg msg--err">Вставьте текст экспорта или выберите файл.</div>'); return; }
    var r = A.parseImport(text);
    if (!r.ok) { pendingImport = null; showImport('<div class="msg msg--err">' + esc(r.error) + '</div>'); return; }
    pendingImport = r;
    var h = '<div class="msg"><p>Найдено отметок: <b>' + r.found + '</b>. Совпало с трофеями игры: <b>' + r.matched.length + '</b>, не совпало: <b>' + r.unmatched.length + '</b>.</p>';
    if (r.unmatched.length) h += '<p class="note">Пропущены: ' + esc(r.unmatched.join('; ')) + '</p>';
    if (r.psnAlready) h += '<p class="note">Уже получены в PSN: ' + r.psnAlready + ' (для них ручная отметка не нужна).</p>';
    h += r.matched.length
      ? '<div class="btns"><button type="button" class="btn btn--primary" data-act="imp-add">Добавить к текущим</button><button type="button" class="btn" data-act="imp-replace">Заменить текущие</button></div>'
      : '<p class="note">Добавлять нечего.</p>';
    showImport(h + '</div>');
  }
  function applyImport(mode) {
    if (!pendingImport) return;
    var n = A.applyImport(pendingImport, mode);
    pendingImport = null;
    var ta = $('[data-imp-text]', infoTools), fi = $('[data-imp-file]', infoTools);
    if (ta) ta.value = '';
    if (fi) fi.value = '';
    showImport('<div class="msg msg--ok">Готово. Ручных отметок теперь: ' + n + '.</div>');
  }

  /* ---------- тост ---------- */
  var toastEl = null, toastTimer = null;
  function toast(text) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.className = 'toast';
      toastEl.setAttribute('role', 'status');
      toastEl.setAttribute('aria-live', 'polite');
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = text;
    toastEl.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('is-on'); }, 2600);
  }

  /* ---------- шторка трофея ---------- */
  A.renderSheet = function (num, body, sheet) {
    var t = A.trophy(num);
    if (!t) return;
    sheet.setAttribute('data-type', t.type);
    var s = A.stageOf(num), psn = A.psn(num), manual = A.isManual(num);
    var rar = rarityText(t), rl = rarityLabel(t);
    var h = '<div class="sh__hd">' + cup('sh__ico') +
      '<div><h2 class="sh__ru">' + esc(t.ru) + (t.hidden ? svg('lock', 'tr__lock', 'скрыт в PSN') : '') + '</h2>' +
      (t.ruOfficial === false ? '<span class="unoff">неофициальный перевод</span>' : '') +
      '<div class="sh__en" lang="en">' + esc(t.en) + '</div>' +
      '<div class="sh__type"><b>' + esc(TYPES_RU[t.type] || t.type) + '</b>' + (rar ? ' · ' + esc(rar) : '') + (rl ? ' · ' + esc(rl) : '') + '</div></div>' +
      '<button type="button" class="iconbtn" data-sheet-close aria-label="Закрыть">' + svg('close') + '</button>' +
      '<div class="frieze" aria-hidden="true"></div></div>';
    h += '<section class="sh__sec"><h3 class="sh__h">Описание в PlayStation</h3><p class="sh__desc">' + esc(t.desc) + '</p>' +
      (t.descOfficial === false ? '<span class="unoff">неофициальный перевод</span>' : '') + '</section>';
    var tags = '';
    if (t.dlc) tags += '<span class="tag tag--dlc">' + svg('dlc') + esc(dlcName(t)) + '</span>';
    if (t.missable) tags += '<span class="tag tag--warn">Можно пропустить</span>';
    if (t.online) tags += '<span class="tag tag--info">Онлайн</span>';
    if (t.buggy) tags += '<span class="tag tag--warn">Возможен баг</span>';
    if (t.grind) tags += '<span class="tag tag--old">Гринд</span>';
    if (tags) h += '<div class="sh__tags">' + tags + '</div>';
    if (s) h += '<p class="sh__stage">Этап: <button type="button" class="linkbtn" data-act="goto-stage" data-stage="' + esc(s.id) + '">' + esc(s.title) + '</button></p>';
    if ((t.tips || []).length) {
      h += '<section class="sh__sec"><h3 class="sh__h">Как получить</h3><ol class="tips">' +
        t.tips.map(function (tip) { return textItem(tip, { tag: 'li' }); }).join('') + '</ol></section>';
    }
    h += '<div class="sh__foot">';
    if (psn) {
      h += '<div class="sh__psn"><span class="mk mk--psn is-on" aria-hidden="true"><span class="mk__box">PSN</span></span>Получено в PSN' + (psn.dateText ? ' · ' + esc(psn.dateText) : '') + '</div>';
    } else {
      h += '<button type="button" class="btn' + (manual ? '' : ' btn--primary') + '" data-mark="' + t.num + '" aria-pressed="' + manual + '">' +
        '<span class="mk mk--hand' + (manual ? ' is-on' : '') + '" aria-hidden="true" style="margin:-10px -6px"><span class="mk__box">' + CHECK + '</span></span>' +
        (manual ? 'Отмечено вручную · снять' : 'Отметить получено') + '</button>';
    }
    body.innerHTML = h + '</div>';
  };
  function refreshSheetKeepScroll() {
    var sb = $('#sheet-root .sheet-body');
    var y = sb ? sb.scrollTop : 0;
    A.refreshSheet();
    if (sb) sb.scrollTop = y;
  }

  /* ---------- платина: эффект один раз ---------- */
  function platFx() {
    if (!A.hasPlatinum || !A.platinumEarned() || A.store.get('platFx', false) === true) return;
    A.store.set('platFx', true);
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var d = document.createElement('div');
    d.className = 'plat-fx';
    d.setAttribute('aria-hidden', 'true');
    d.innerHTML = '<div class="plat-fx__ring"></div>' + cup('plat-fx__cup') + '<div class="plat-fx__txt">Платина получена</div>';
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 2600);
  }
  function shineBar() {
    var i = hdr && $('.bar>i', hdr);
    if (!i) return;
    i.classList.remove('is-shine');
    void i.offsetWidth;
    i.classList.add('is-shine');
    setTimeout(function () { i.classList.remove('is-shine'); }, 1000);
  }

  /* ---------- перерисовка ---------- */
  var lastMarked = null;
  function renderDynamic() {
    renderHeader();
    renderNow();
    renderPlan();
    renderList();
    renderExtras();
    renderInfo();
  }
  A.renderAll = function () {
    buildHeader();
    buildTabbar();
    buildTrophies();
    buildInfo();
    renderDynamic();
  };
  A.onRoute = function (tab) {
    var p = document.getElementById('tab-' + tab);
    if (!p) return;
    $$('.panel.is-active').forEach(function (x) { x.classList.remove('is-active'); });
    void p.offsetWidth;
    p.classList.add('is-active');
  };
  A.on('change', function (d) {
    var r = d.reason;
    if (r === 'reveal') { if (searchEl && searchEl.value.trim()) renderList(); return; }
    if (r === 'progress' && A.progressState === 'ok') A.markSeen();
    renderDynamic();
    if (A.sheetOpen()) refreshSheetKeepScroll();
    if (r === 'manual' && lastMarked != null) {
      var n = lastMarked;
      lastMarked = null;
      if (A.isManual(n)) $$('[data-num="' + n + '"] .mk--hand, #sheet-root .mk--hand').forEach(function (m) { m.classList.add('is-pop'); });
      shineBar();
    }
    if (r === 'progress' || r === 'manual' || r === 'import') platFx();
  });

  /* ---------- действия ---------- */
  // Отметки: перехват до делегата шторки ядра (карточка сама открывает шторку).
  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-mark]');
    if (!el) return;
    e.preventDefault();
    e.stopPropagation();
    var n = +el.getAttribute('data-mark');
    lastMarked = n;
    if (!A.toggleManual(n)) lastMarked = null;
  }, true);

  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-act],[data-group],[data-ftype],[data-fflag]');
    if (!el) return;
    if (el.hasAttribute('data-group')) { A.setGroup(el.getAttribute('data-group')); renderList(); return; }
    if (el.hasAttribute('data-ftype')) {
      var ty = el.getAttribute('data-ftype');
      setFilter('type', A.getFilters().type === ty ? '' : ty);
      return;
    }
    if (el.hasAttribute('data-fflag')) {
      var k = el.getAttribute('data-fflag');
      setFilter(k, !A.getFilters()[k]);
      return;
    }
    var act = el.getAttribute('data-act');
    switch (act) {
      case 'spoilers': A.setSpoilers(!A.spoilersOn()); break;
      case 'reveal': e.preventDefault(); revealItem(+el.getAttribute('data-sp')); break;
      case 'stage': toggleStage(el.getAttribute('data-stage')); break;
      case 'pin': A.pinStage(el.getAttribute('data-stage')); toast('Этап закреплён — он показан в «Сейчас»'); break;
      case 'unpin': A.unpinStage(); toast('Закрепление снято'); break;
      case 'dlc': showStage(null); break;
      case 'goto-stage':
        var sid = el.getAttribute('data-stage');
        var go = function (ev) { if (ev && ev.open) return; A.off('sheet', go); setTimeout(function () { showStage(sid); }, 30); };
        A.on('sheet', go);
        A.closeSheet();
        break;
      case 'seen': A.markSeen(true); break;
      case 'news-more':
        var rest = document.getElementById('news-rest');
        if (rest) { rest.hidden = false; el.parentNode.removeChild(el); var f = rest.querySelector('button,a'); if (f) f.focus({ preventScroll: true }); }
        break;
      case 'filters': setFilterPanel(!$('#fpanel', tEl).classList.contains('is-open')); break;
      case 'freset': A.setFilters({}); if (searchEl) searchEl.value = ''; renderList(); break;
      case 'reset':
        if (window.confirm('Сбросить все ручные отметки? Отметки PSN останутся.')) { A.resetManual(); toast('Ручные отметки сброшены'); }
        break;
      case 'export': toast('Файл сохранён: ' + A.downloadExport()); break;
      case 'copy':
        A.copyExport().then(function (ok) { toast(ok ? 'Отметки скопированы в буфер обмена' : 'Не удалось скопировать'); });
        break;
      case 'imp-check': checkImport(($('[data-imp-text]', infoTools) || {}).value || ''); break;
      case 'imp-add': applyImport('add'); break;
      case 'imp-replace':
        if (window.confirm('Заменить текущие ручные отметки отметками из файла?')) applyImport('replace');
        break;
    }
  });

  window.addEventListener('resize', setHeaderVar, { passive: true });
})();

document.addEventListener('DOMContentLoaded', function () { App.start(); });
</script>
</body>
</html>
